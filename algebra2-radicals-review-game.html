          const a = bedP(k), ground = { x: WAGON.x - 60, y: WAGON.y + 26 }, b = fieldP(k), el = inBed[k];
          // it teeters at the edge, tips off the back of the wagon, bounces twice in a puff of dust, rolls away, and is back in the patch
          return x.tween(460, t => x.pose(el, Object.assign({}, a, { rot: a.rot + 14 * Math.sin(t * 3 * Math.PI) * (0.4 + t) })))
            .then(() => x.tween(520, t => x.pose(el, { x: lerp(a.x, ground.x, t), y: lerp(a.y, ground.y, x.easeIn(t)) - 26 * Math.sin(Math.PI * t), rot: a.rot - 220 * t, s: 1, o: 1 })))
            .then(() => { dust(ground.x, ground.y + 6); return x.tween(300, t => x.pose(el, { x: ground.x - 12 * t, y: ground.y - 12 * Math.sin(Math.PI * t), rot: a.rot - 260 * (1 + t * 0.3), s: 1, o: 1 })); })
            .then(() => { dust(ground.x - 12, ground.y + 6); return x.tween(180, t => x.pose(el, { x: ground.x - 12 - 6 * t, y: ground.y - 4 * Math.sin(Math.PI * t), rot: a.rot - 340, s: 1, o: 1 })); })
            .then(() => x.tween(900, t => x.pose(el, { x: lerp(ground.x - 18, ground.x - 60, x.easeOut(t)), y: ground.y + 4 * t, rot: a.rot - 340 - 400 * x.easeOut(t), s: 1, o: 1 - t })))
            .then(() => { x.pose(el, Object.assign(bedP(k), { o: 0 })); return x.tween(500, t => x.pose(inField[k], Object.assign({}, b, { s: 0.2 + 0.8 * easeOutBack(t), o: Math.min(1, t * 2) }))); });
        }
        function finale() {
          // the tractor coughs to life (shaking, big puffs of smoke), then pulls the full wagon off toward the barn,
          // puffing as it goes; evening falls, the barn window lights up, the moon rises and the first stars come out
          driving = true;
          const dist = 340;
          let dxNow = 0;
          const start = x.tween(1400, t => { rigSet(0, Math.sin(t * 90) * 1.3 * (1 - t * 0.5)); }, 100);
          const coughs = [150, 520, 900].map((d, k) => puff(STACK.x, STACK.y, 1.5 - k * 0.15, d));
          const go = x.tween(4400, t => {
            const e = x.easeIn(Math.min(1, t * 1.08)); dxNow = dist * e;
            rigSet(dxNow, -Math.abs(Math.sin(t * 46)) * 0.9);
            wheels.forEach(([el, rad], k) => el.setAttribute('transform', wheelHome[k] + ' rotate(' + f(dxNow / rad * 57.3) + ')'));
          }, 1500);
          const trail = Array.from({ length: 11 }, (_, k) => x.wait(1550 + k * 360).then(() => (dxNow < dist - 10 ? puff(STACK.x + dxNow, STACK.y, 0.9) : null)));
          const evening = x.tween(4600, t => dusk.setAttribute('opacity', f(x.easeInOut(t))), 1500);
          const barn = x.tween(700, t => barnWin.setAttribute('opacity', f(t)), 3700);
          const rise = x.tween(3400, t => { moon.setAttribute('opacity', f(Math.min(1, t * 2))); moon.setAttribute('transform', 'translate(150 ' + f(84 - 50 * x.easeOut(t)) + ')'); }, 3200);
          const night = x.tween(1300, t => { starsOn = t; }, 4400);
          return Promise.all([start, go, evening, barn, rise, night].concat(coughs, trail)).then(() => x.wait(400));
        }
        function ambient(T) {
          drift(clouds, T); sway(tufts, T, 4);
          if (starsOn) twinkle(stars, T, starsOn);
          if (driving) return;
          // the tractor idles: a little shake and a small puff now and then
          rigSet(0, rigDip + Math.sin(T * 72) * 0.35);
          if (T - lastPuff > 1.3) { lastPuff = T; puff(STACK.x, STACK.y, 0.55); }
        }
        return { sync, place, remove, finale, ambient };
      }
    };
  };

  // ===== 3. Geese flying south: each step brings a goose into the V; a miss drops one out; the ending flies the flock away =====
  BUILD.geese = function (uid, n, r) {
    const land = K.landscape(uid, r, { sunX: 236, sunY: 120, lawnY: 206, blades: 260, litter: 0, lawnTop: '#7f8a40', lawnBottom: '#5f6a2c' });
    // the V: a leader at the front, then alternating arms trailing back to the left
    const LEAD = { x: 214, y: 64 };
    const SLOT = [];
    for (let k = 0; k < 12; k++) { const arm = k % 2 ? 1 : -1, rank = Math.floor((k + 1) / 2); SLOT.push(k === 0 ? LEAD : { x: LEAD.x - rank * 22, y: LEAD.y + arm * rank * 11 + (arm > 0 ? 0 : 0) }); }
    SLOT.splice(n);
    // one goose, flying right; the near wing flaps around the shoulder
    const goose = '<g class="sc-mv">' +
      '<path class="sc-wfar" d="M-2-2C-6-10-4-18 2-22C4-14 6-8 6-2Z" fill="#4e4842"/>' +
      '<ellipse cx="0" cy="0" rx="11" ry="4.6" fill="url(#' + uid + '-body)"/>' +
      '<path d="M-10 0L-16-3L-15 2Z" fill="#2a2420"/><path d="M-8 2.6C-4 4.6 4 4.6 8 2.6" stroke="#e8e2d6" stroke-width="1.6" fill="none" opacity=".8"/>' +
      '<path d="M8-1C12-2 15-3 18-4" stroke="#1e1a18" stroke-width="2.8" stroke-linecap="round" fill="none"/>' +                // neck
      '<ellipse cx="19.4" cy="-4.4" rx="2.8" ry="2.2" fill="#1e1a18"/><path d="M21.6-4.6l3.2 .6-3 .8Z" fill="#2a2420"/><path d="M18.4-3.2C19.4-2.4 20.4-2.6 21-3.4" stroke="#f2ece0" stroke-width="1" fill="none"/>' +
      '<g class="sc-wnear"><path d="M-4 0C-8 8-6 18 2 22C4 14 7 7 7 0Z" fill="url(#' + uid + '-wing)"/></g></g>';
    // water and reeds in front: a calm lake reflecting the sky
    let bg = land.bg + '<path d="M0 194C60 190 120 196 180 192S280 190 300 194V214H0Z" fill="url(#' + uid + '-lake)"/>';
    for (let k = 0; k < 14; k++) bg += '<path d="M' + f(r() * 300) + ' ' + f(198 + r() * 12) + 'h' + f(10 + r() * 30) + '" stroke="#fff4dc" stroke-width=".8" opacity=".5"/>';
    bg += '<ellipse cx="236" cy="200" rx="14" ry="2" fill="#fff0c8" opacity=".6"/>';
    for (let k = 0; k < 40; k++) { const x0 = r() * 300, h = 14 + r() * 26; bg += '<path d="M' + f(x0) + ' 240q' + f((r() - 0.5) * 8) + ' -' + f(h * 0.6) + ' ' + f((r() - 0.5) * 10) + ' -' + f(h) + '" stroke="' + (k % 3 ? '#8a7a3a' : '#a89450') + '" stroke-width="1.6" fill="none"/>'; if (k % 5 === 0) bg += '<ellipse cx="' + f(x0) + '" cy="' + f(240 - h) + '" rx="1.6" ry="5" fill="#6a4a2a"/>'; }
    const shimmer = Array.from({ length: 9 }, (_, k) => '<path class="sc-shim" d="M' + f(14 + ((k * 61) % 270)) + ' ' + f(197 + (k * 7) % 14) + 'h' + f(8 + (k * 13) % 18) + '" stroke="#fff6e0" stroke-width="1" stroke-linecap="round" opacity=".3"/>').join('');
    const svg = CLOUD(0, 28) + CLOUD(1, 46) + CLOUD(2, 16) + shimmer +
      Array.from({ length: 3 }, () => '<ellipse class="sc-ripple" rx="8" ry="2.2" fill="none" stroke="#fff6e4" stroke-width="1" opacity="0"/>').join('') +
      '<g class="sc-flock">' + SLOT.map((_, k) => '<g data-k="' + k + '">' + goose + '</g>').join('') + '</g>' +
      '<g class="sc-feather" opacity="0"><path d="M0-6C2.4-3 2.4 3 0 6C-1.6 3-1.6-3 0-6Z" fill="#8e8478"/><path d="M0-6V6" stroke="#5e554c" stroke-width=".5"/></g>' +
      [10, 30, 52, 250, 268, 290].map((rx, k) => '<g class="sc-tuft" data-x="' + rx + '" data-y="242" transform="translate(' + rx + ' 242)"><path d="M0 0q' + (k % 2 ? 2 : -2) + '-14 0-' + (24 + k * 3) + '" stroke="#8a7a3a" stroke-width="1.7" fill="none"/><ellipse cx="' + (k % 2 ? 1 : -1) + '" cy="-' + (24 + k * 3) + '" rx="1.8" ry="5" fill="#6a4a2a"/><path d="M0-2q-5-8-9-11M0-2q5-9 8-13" stroke="#7d8a3c" stroke-width="1.3" fill="none"/></g>').join('') +
      '<g class="sc-dusk" opacity="0"><rect width="300" height="240" fill="url(#' + uid + '-dusk)"/></g>' + land.light +
      [[70, 22], [120, 40], [160, 12], [208, 30], [256, 16], [28, 50]].map(([sx, sy]) => STAR(sx, sy)).join('');
    return {
      aria: 'Geese gathering into a V to fly south',
      defs: land.defs + K.lg(uid + '-body', [[0, '#9a8e80'], [1, '#5e554c']]) + K.lg(uid + '-wing', [[0, '#7a6e62'], [1, '#3e3832']]) +
        K.lg(uid + '-lake', [[0, '#b9c7c8'], [0.5, '#e6cfa6'], [1, '#8fa0a4']]) + K.lg(uid + '-dusk', [[0, '#6a4a8a', 0.3], [0.5, '#f2904a', 0.22], [1, '#2a1a10', 0.3]]),
      bg, svg,
      init(x) {
        const els = x.q('.sc-flock > g'), dusk = x.svg.querySelector('.sc-dusk'), clouds = x.q('.sc-cloud'), reeds = x.q('.sc-tuft'), stars = x.q('.sc-star');
        const shims = x.q('.sc-shim'), ripples = x.q('.sc-ripple'), feather = x.svg.querySelector('.sc-feather');
        const wingN = els.map(el => el.querySelector('.sc-wnear')), wingF = els.map(el => el.querySelector('.sc-wfar'));
        const slot = k => ({ x: SLOT[k].x, y: SLOT[k].y, rot: 0, s: 1, o: 1 });
        const off = k => ({ x: -40, y: 40 + (k * 37) % 120, rot: -6, s: 1, o: 0 });
        // flap: the near wing swings from up to down; the far wing answers it
        const flap = (k, ph) => { const s = Math.sin(ph); wingN[k].setAttribute('transform', 'scale(1 ' + f(s) + ')'); wingF[k].setAttribute('transform', 'scale(1 ' + f(-0.6 * s + 0.4) + ')'); };
        const glide = k => { wingN[k].setAttribute('transform', 'scale(1 .35)'); wingF[k].setAttribute('transform', 'scale(1 .6)'); };
        const on = new Array(n).fill(false), busy = new Set();
        let fin = false, starsOn = 0;
        function sync(done) {
          els.forEach((el, k) => { x.pose(el, done[k] ? slot(k) : off(k)); glide(k); on[k] = !!done[k]; });
          busy.clear(); fin = false; starsOn = 0;
          [dusk, feather].concat(ripples, stars).forEach(e => e.setAttribute('opacity', '0'));
        }
        function place(k) {
          const a = off(k), b = slot(k), el = els[k];
          busy.add(k);
          // flies in from the left with strong wingbeats, swoops a little past its place in the V, then eases back and glides
          return x.tween(1350, t => {
            const e = x.easeOut(t);
            x.pose(el, { x: lerp(a.x, b.x + 9, e), y: lerp(a.y, b.y - 4, x.easeInOut(t)) + Math.sin(t * 18) * 1.4 * (1 - t), rot: lerp(-8, 3, e), s: 1, o: Math.min(1, t * 4) });
            flap(k, t * 30);
          }).then(() => x.tween(420, t => { const e = x.easeInOut(t); x.pose(el, { x: lerp(b.x + 9, b.x, e), y: lerp(b.y - 4, b.y, e), rot: 3 * (1 - e), s: 1, o: 1 }); flap(k, Math.PI / 2 + t * 6); }))
            .then(() => { glide(k); on[k] = true; busy.delete(k); });
        }
        function remove(k) {
          const a = slot(k), el = els[k], lake = { x: a.x - 70, y: 202 };
          busy.add(k); on[k] = false;
          // it falters (wobbling, out of rhythm), a feather comes loose, it drops out of the V and glides down
          // to the lake with a splash of ripples, and swims off out of sight
          const fx = a.x, fy = a.y + 4;
          const loose = x.tween(2100, t => {
            feather.setAttribute('opacity', f(Math.min(1, t * 6) * (1 - Math.max(0, (t - 0.8) / 0.2))));
            feather.setAttribute('transform', 'translate(' + f(fx - 30 * t + Math.sin(t * 9) * 8) + ' ' + f(fy + 120 * Math.pow(t, 1.2)) + ') rotate(' + f(Math.sin(t * 9) * 50) + ')');
          }, 250);
          const fall = x.tween(560, t => { x.pose(el, { x: a.x + Math.sin(t * 20) * 2, y: a.y + 6 * t, rot: 16 * Math.sin(t * 5 * Math.PI), s: 1, o: 1 }); flap(k, t * 22 + Math.sin(t * 9) * 2); })
            .then(() => x.tween(1300, t => { const e = x.easeIn(t); x.pose(el, { x: lerp(a.x, lake.x, t), y: lerp(a.y + 6, lake.y, e), rot: 10 * Math.sin(Math.PI * t), s: 1 - 0.15 * t, o: 1 }); flap(k, t * 14); }))
            .then(() => {
              glide(k);
              const splash = x.tween(1100, t => ripples.forEach((r0, j) => { const c = Math.max(0, t - j * 0.18); r0.setAttribute('transform', 'translate(' + lake.x + ' ' + (lake.y + 4) + ') scale(' + f(0.3 + 2.2 * c) + ' ' + f(0.3 + 0.9 * c) + ')'); r0.setAttribute('opacity', f(c > 0 ? 0.8 * (1 - c) : 0)); }));
              const swim = x.tween(900, t => x.pose(el, { x: lake.x - 30 * t, y: lake.y + 2, rot: 0, s: 0.85, o: 1 - t }), 300);
              return Promise.all([splash, swim]);
            });
          return Promise.all([loose, fall]).then(() => { x.pose(el, off(k)); glide(k); busy.delete(k); });
        }
        function finale() {
          // the whole flock beats its wings and lifts, then flies away up into the evening sky, getting smaller and
          // smaller; a gust sends leaves past, and the first stars come out
          fin = true;
          const ready = x.tween(900, t => els.forEach((el, k) => { if (!on[k]) return; x.pose(el, { x: SLOT[k].x, y: SLOT[k].y - 6 * x.easeOut(t), rot: -3 * t, s: 1, o: 1 }); flap(k, t * 26 + k * 0.6); }), 100);
          const away = x.tween(5000, t => {
            const e = x.easeIn(t);
            els.forEach((el, k) => { if (!on[k]) return; x.pose(el, { x: SLOT[k].x + 300 * e * (1 - 0.1 * e), y: SLOT[k].y - 6 - 42 * e + Math.sin(t * 20 + k) * 1.4 * (1 - e), rot: -4 - 6 * e, s: 1 - 0.55 * e, o: 1 - Math.max(0, (e - 0.85) / 0.15) }); flap(k, t * 40 + k * 0.7); });
          }, 1000);
          const evening = x.tween(5000, t => dusk.setAttribute('opacity', f(x.easeInOut(t))), 900);
          const night = x.tween(1300, t => { starsOn = t; }, 4500);
          return Promise.all([ready, away, evening, night, x.wait(1500).then(() => x.gust(false)), x.wait(3600).then(() => x.gust(false))]).then(() => x.wait(300));
        }
        function ambient(T) {
          drift(clouds, T); sway(reeds, T, 3);
          if (starsOn) twinkle(stars, T, starsOn);
          shims.forEach((l, k) => { l.setAttribute('transform', 'translate(' + f(Math.sin(T * 0.7 + k * 1.3) * 7) + ' 0)'); l.setAttribute('opacity', f(0.2 + 0.3 * (0.5 + 0.5 * Math.sin(T * 1.6 + k * 2.1)))); });
          if (fin) return;
          // geese in the V bob on the air and give a few slow wingbeats now and then
          on.forEach((d, k) => {
            if (!d || busy.has(k)) return;
            x.pose(els[k], { x: SLOT[k].x, y: SLOT[k].y + Math.sin(T * 1.7 + k * 0.8) * 1.7, rot: Math.sin(T * 1.1 + k) * 1.5, s: 1, o: 1 });
            const ph = (T * 0.33 + k * 0.29) % 1;
            if (ph < 0.22) flap(k, Math.PI / 2 + (ph / 0.22) * Math.PI * 4); else glide(k);
          });
        }
        return { sync, place, remove, finale, ambient };
      }
    };
  };

  return { create, has: name => !!BUILD[name], text: name => TEXT[name] };
})();

<script>
/* =====================================================================
   5. GAME ENGINE — rounds, the puzzle scoreboard, saving, sound, screens.
   Works with any content pack and any puzzle picture, with or without a
   set of seasonal round-clear sounds (sounds.js).
   ===================================================================== */
(function () {
  'use strict';
  const C = GAME_CONTENT, ARTS = PUZZLE_ART_SET.pictures;
  // What the student finishes each round: a jigsaw of a picture, or one of the animated scenes in scenes.js.
  // art.js may list them as PUZZLE_ART_SET.rewards; otherwise every round is a jigsaw of the next picture.
  const PUZZLE_TEXT = {
    progress: 'pieces placed', doneShort: 'Puzzle complete!', blurb: 'a picture puzzle to put together',
    gain: k => (k === 1 ? 'A piece goes' : k + ' pieces go') + ' into place.',
    lose: k => (k === 1 ? 'A piece goes' : k + ' pieces go') + ' back to the pile.', none: 'No pieces were in place to lose.'
  };
  const HAS_SCENES = typeof Scenes !== 'undefined';
  const listWords = w => (w.length < 2 ? w.join('') : w.slice(0, -1).join(', ') + (w.length > 2 ? ',' : '') + ' and ' + w[w.length - 1]);
  const REWARDS = (PUZZLE_ART_SET.rewards || ARTS.map(art => ({ art })))
    .filter(r => r.art || (HAS_SCENES && Scenes.has(r.scene)))
    .map(r => (r.scene ? Object.assign({}, Scenes.text(r.scene), r) : Object.assign({ label: r.art.label }, PUZZLE_TEXT, r)));
  const S = Object.assign({ missPauseSeconds: 4, endlessRounds: null }, C.settings || {});
  // Optional, set by the content pack:
  //   swapOnLeave: { awaySeconds }  leaving the game while a question is open (another tab or app, minimizing,
  //                                 or a reload) brings a new problem of the same type when the student returns.
  //                                 Covering the window with another app counts once it lasts awaySeconds.
  //   blockCopy: true                question text can't be selected, copied or right-clicked; copy attempts are still counted.
  const SWAP = S.swapOnLeave ? Object.assign({ awaySeconds: 5 }, S.swapOnLeave) : null;
  // The puzzle is the score: cols x rows pieces; a correct answer places perCorrect, a miss removes perMiss.
  const PZ = Object.assign({ cols: 4, rows: 3, perCorrect: 1, perMiss: 1 }, S.puzzle || {});
  const NP = PZ.cols * PZ.rows;
  const NR = C.rounds.length;
  const KEY = 'reviewgame:' + C.id + ':v' + C.version, KEY_RESETS = KEY + ':resets', KEY_BEST = KEY + ':best', KEY_SOUND = 'reviewgame:sound';
  const $ = sel => document.querySelector(sel);
  const main = $('#main'), overlay = $('#overlay');
  const esc = RG.esc, rich = RG.rich;
  // A choice may be a small graph (an SVG string the content pack drew) instead of text.
  const isFig = c => /^<svg[\s>]/.test(String(c));
  const show = c => (isFig(c) ? '<span class="gchoice">' + c + '</span>' : rich(c));
  // Seasonal round-clear sounds, one per picture. When the build has none, the plain boom and fanfare play instead.
  const SFX = typeof PUZZLE_SOUND_SET !== 'undefined' && PUZZLE_SOUND_SET && typeof PUZZLE_SOUND_SET.play === 'function' ? PUZZLE_SOUND_SET : null;
  const topicName = k => (C.topics.find(t => t.key === k) || { name: k }).name;
  // one picture per round; Challenge Mode keeps cycling through them
  const artIndex = () => (state.mode === 'endless' ? NR + (state.endless.puzzles || 0) : state.round - 1) % REWARDS.length;
  const reward = () => REWARDS[artIndex()];
  const mqSide = window.matchMedia ? window.matchMedia('(min-width: 1000px)') : { matches: true };
  const reducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- storage (falls back to memory if the browser blocks it) ----------
  const store = {
    mem: {},
    get(k) { try { const v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) { /* blocked */ } return k in this.mem ? this.mem[k] : null; },
    set(k, v) { this.mem[k] = v; try { window.localStorage.setItem(k, v); } catch (e) { /* blocked */ } },
    del(k) { delete this.mem[k]; try { window.localStorage.removeItem(k); } catch (e) { /* blocked */ } }
  };
  // Light scrambling so saved progress is not readable or editable at a glance.
  const scramble = s => btoa(Array.from(encodeURIComponent(s), (ch, i) => String.fromCharCode(ch.charCodeAt(0) ^ (17 + (i % 7)))).join(''));
  const unscramble = s => decodeURIComponent(Array.from(atob(s), (ch, i) => String.fromCharCode(ch.charCodeAt(0) ^ (17 + (i % 7)))).join(''));

  let state = null, sel = null, timers = [], view = 'start', puz = null, puzKey = null;
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; RGActivity.pause(); };   // leaving a question screen stops its clock

  function save() { if (state) store.set(KEY, scramble(JSON.stringify(state))); }
  // furthest round ever reached on this computer (NR + 1 = finished), kept even after Start over
  const bestSoFar = () => Number(store.get(KEY_BEST) || 0);
  function noteBest() { if (state) store.set(KEY_BEST, String(Math.max(bestSoFar(), state.won ? NR + 1 : state.round))); }
  function load() {
    try {
      const raw = store.get(KEY);
      if (!raw) return null;
      const st = JSON.parse(unscramble(raw));
      if (!(st && st.name && st.topics && st.rounds && st.rounds.length === NR)) return null;
      st.placed = Array.from(new Set(Array.isArray(st.placed) ? st.placed : [])).filter(i => Number.isInteger(i) && i >= 0 && i < NP);
      if (!Array.isArray(st.log)) st.log = [];
      return st;
    } catch (e) { return null; }
  }
  function fresh(name) {
    const topics = {};
    C.topics.forEach(t => { topics[t.key] = { right: 0, wrong: 0 }; });
    return {
      name, startedAt: Date.now(), round: 1, placed: [], won: false, mode: 'ladder',
      total: { right: 0, wrong: 0 }, topics, rounds: C.rounds.map(() => ({ right: 0, wrong: 0 })),
      endless: { right: 0, wrong: 0, streak: 0, best: 0, puzzles: 0 }, timeMs: 0, cur: null,
      rot: { queue: [], used: {}, last: null }, log: []
    };
  }

  // ---------- sound ----------
  let soundOn = store.get(KEY_SOUND) !== 'off', actx = null;
  function audio() {
    if (!soundOn) return null;
    try {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      if (!actx) { actx = new A(); if (SFX && SFX.warm) setTimeout(() => { try { SFX.warm(actx); } catch (e) { /* none */ } }, 1500); }   // sound sets that pre-render their clips start now
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function note(ctx, freq, start, dur, vol, type) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(ctx.destination);

  }
  // A short brass-style fanfare; each round starts a step higher. Returns its length in ms.
  function fanfare(level, big, delay) {
    const ctx = audio();
    if (!ctx) return 0;
    try {
      const t = ctx.currentTime + 0.05 + (delay || 0), base = 261.63 * Math.pow(2, ((level - 1) * 2) / 12);
      const third = Math.pow(2, 4 / 12), fifth = Math.pow(2, 7 / 12);
      const seq = big
        ? [[0, 0.16, 1], [0.16, 0.16, third], [0.32, 0.16, fifth], [0.48, 0.3, 2], [0.8, 0.16, fifth], [0.96, 0.16, 2], [1.12, 0.9, 2 * third]]
        : [[0, 0.14, 1], [0.14, 0.14, third], [0.28, 0.14, fifth], [0.42, 0.6, 2]];
      seq.forEach(([at, d, m]) => { note(ctx, base * m, t + at, d, 0.16, 'triangle'); note(ctx, base * m * 2, t + at, d, 0.04, 'square'); });
      const end = seq[seq.length - 1];
      [1, third, fifth].forEach(m => note(ctx, base * m, t + end[0], end[1], 0.06, 'sawtooth'));
      return ((delay || 0) + end[0] + end[1]) * 1000;
    } catch (e) { return 0; }
  }
  // The burst when a finished puzzle flies apart: filtered noise plus a low thump.
  function boom() {
    const ctx = audio();
    if (!ctx) return;
    try {
      const t = ctx.currentTime + 0.02, len = Math.floor(ctx.sampleRate * 0.5);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      const src = ctx.createBufferSource(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = buf; lp.type = 'lowpass';
      lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(180, t + 0.45);
      g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start(t);
      const o = ctx.createOscillator(), g2 = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.35);
      g2.gain.setValueAtTime(0.38, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g2); g2.connect(ctx.destination); o.start(t); o.stop(t + 0.45);
    } catch (e) { /* no sound */ }
  }
  // The most natural-sounding English voice this computer has: the newer neural / "Natural" / "Online" voices first,
  // then well-known good ones, then any English voice. (Voices load a moment after the page opens.)
  let voicePick = null;
  function bestVoice() {
    try {
      if (voicePick) return voicePick;
      const all = window.speechSynthesis.getVoices() || [], en = all.filter(v => /^en(-|_|$)/i.test(v.lang || ''));
      if (!en.length) return null;
      const score = v => {
        const nm = v.name || '';
        let s = /natural|neural|online|enhanced|premium/i.test(nm) ? 50 : 0;
        if (/google us english|samantha|ava|allison|aria|jenny|guy|zira|daniel|karen|moira/i.test(nm)) s += 20;
        if (/en[-_]US/i.test(v.lang)) s += 10;
        if (/compact|novelty|whisper|bad news|bells|boing|bubbles|cellos|zarvox|trinoids|albert|jester|organ|superstar|wobble/i.test(nm)) s -= 100;
        return s;
      };
      voicePick = en.slice().sort((a, b) => score(b) - score(a))[0];
      return voicePick;
    } catch (e) { return null; }
  }
  try { window.speechSynthesis.onvoiceschanged = () => { voicePick = null; }; } catch (e) { /* no speech */ }
  function say(text) {
    if (!soundOn) return;
    try {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text), v = (SFX && SFX.voice) || {}, best = bestVoice();
      if (best) u.voice = best;
      u.rate = v.rate || 1.05; u.pitch = v.pitch || 1.15; u.volume = 0.9;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    } catch (e) { /* no speech available */ }
  }
  // The sound for a finished puzzle: the seasonal clip for picture number ai (the finale clip for the last round),
  // or the boom and fanfare when there is no sound set. Remembers when it ends so speech can wait its turn.
  let sfxEnds = 0;
  function clearedSound(ai, level, last) {
    let ms = 0;
    const ctx = SFX ? audio() : null;
    if (ctx && ctx.state === 'running') { try { ms = SFX.play(ctx, ai, last) * 1000 || 0; } catch (e) { ms = 0; } }
    if (!ms) { boom(); ms = fanfare(level, last, 0.3); }
    sfxEnds = Date.now() + ms;
  }
  // Speak once the round-clear sound has finished, so the two do not play over each other.
  function sayAfterSound(text) {
    const wait = sfxEnds - Date.now();
    if (wait > 50) later(() => say(text), wait); else say(text);
  }

  // ---------- picking the next question ----------
  function nextQuestion() {
    const r = state.mode === 'endless' ? RG.pick(S.endlessRounds || [NR]) : state.round;
    const pool = C.questions.filter(q => [].concat(q.round).includes(r));
    // Deal the groups (key areas when the content pack sets rotateBy: 'area', otherwise topics) like a
    // shuffled deck: every group once, in a random order for each student, before any group repeats.
    const by = S.rotateBy === 'area' ? 'area' : 'topic';
    const group = q => (by === 'area' && q.areas && q.areas[r]) || q[by];   // a type can sit in a different key area in each round
    const topicsHere = [...new Set(pool.map(group))];
    const rot = state.rot;
    if (!rot.queue.length) {
      rot.queue = RG.shuffle(topicsHere);
      if (rot.queue.length > 1 && rot.queue[0] === rot.last) rot.queue.push(rot.queue.shift());
    }
    let topic = rot.queue.shift();
    if (!topicsHere.includes(topic)) topic = RG.pick(topicsHere);
    rot.last = topic;
    const cands = pool.filter(q => group(q) === topic), usedKey = r + ':' + topic;
    let used = rot.used[usedKey] || [];
    let avail = cands.filter(q => !used.includes(q.id));
    if (!avail.length) { used = cands.length > 1 ? [used[used.length - 1]] : []; avail = cands.filter(q => !used.includes(q.id)); }
    const t = RG.pick(avail);
    used.push(t.id); rot.used[usedKey] = used;
    state.cur = makeCur(t);
    sel = null;
    save();
    renderPlay();
  }
  function makeCur(t) {
    const q = RG.build(t);
    return { id: q.id, topic: q.topic, q: q.q, fig: q.fig, choices: q.choices, tags: q.tags, ans: q.ans, why: q.why, phase: 'ask', picked: null };
  }
  // The student left the game while a question was open: a new problem of the same type (new numbers, new order).
  // Time, leaving and copying carried over to it, so the answer's activity counts everything since the question first came up.
  function swapQuestion(why) {
    const old = state && state.cur;
    if (!SWAP || !old || old.phase !== 'ask') return;
    const t = C.questions.find(q => q.id === old.id);
    if (!t) return;
    RGActivity.pause();
    const cur = makeCur(t);
    cur.act = old.act; cur.sw = (old.sw || 0) + 1; cur.swapNote = why;
    state.cur = cur; state.swaps = (state.swaps || 0) + 1;
    sel = null;
    save();
    if (view === 'play') renderPlay();
  }

  // ---------- answering ----------
  function submit() {
    const cur = state.cur;
    if (!cur || cur.phase !== 'ask' || sel === null) return;
    audio(); // first click unlocks sound for the fanfare
    const ok = sel === cur.ans;
    cur.picked = sel;
    // time on this question: only while the page was in front of the student, kept across refreshes
    const act = RGActivity.finish(cur), spent = act.ms;
    state.timeMs += Math.min(spent, 180000);
    state.acts = state.acts || [];
    state.acts[state.log.length] = { lv: act.lv, aw: Math.round(act.away / 1000), cp: act.cp, rl: act.rl, sw: cur.sw || 0 };
    // the answer log behind the results code: which question, which mistake (if any), which round, how long
    state.log.push(RGResults.entry(C, cur.id, ok ? null : ((cur.tags || [])[sel] || 'unknown'), state.mode === 'endless' ? 0 : state.round, spent));
    state.total[ok ? 'right' : 'wrong']++;
    state.topics[cur.topic][ok ? 'right' : 'wrong']++;
    if (state.mode === 'endless') {
      const e = state.endless;
      e[ok ? 'right' : 'wrong']++;
      e.streak = ok ? e.streak + 1 : 0;
      e.best = Math.max(e.best, e.streak);
    } else {
      state.rounds[state.round - 1][ok ? 'right' : 'wrong']++;
    }
    // the puzzle: a correct answer places pieces, a miss sends random placed pieces back to the pile
    if (ok) {
      const open = [];
      for (let i = 0; i < NP; i++) if (!state.placed.includes(i)) open.push(i);
      cur.added = RG.shuffle(open).slice(0, PZ.perCorrect);
      state.placed = state.placed.concat(cur.added);
    } else {
      cur.removed = RG.shuffle(state.placed).slice(0, PZ.perMiss);
      state.placed = state.placed.filter(i => !cur.removed.includes(i));
    }
    cur.cleared = ok && state.placed.length >= NP;
    cur.phase = ok ? 'right' : 'wrong';
    save();
    renderPlay(true);
  }
  function proceed() {
    clearTimers();
    const cur = state.cur;
    if (cur && cur.cleared) return roundCleared();
    nextQuestion();
  }
  // The picture is complete: burst it apart, send every piece back to the pile, then move on.
  function roundCleared() {
    clearTimers();
    ensureShell();
    view = 'advance';
    const from = state.round, endless = state.mode === 'endless', last = !endless && from === NR, ai = artIndex();
    state.cur = null; state.placed = [];
    if (endless) state.endless.puzzles = (state.endless.puzzles || 0) + 1;
    else { state.rot = { queue: [], used: {}, last: null }; if (last) state.won = true; else state.round = from + 1; }
    noteBest();
    save();
    const btn = $('#btnNext'); if (btn) btn.disabled = true;
    const rw = REWARDS[ai];
    $('#pcount').textContent = rw.doneShort;
    const panel = $('#puzzlePanel');
    if (!rw.scene && !(puz && puz.gentle)) { panel.classList.remove('boom'); void panel.offsetWidth; panel.classList.add('boom'); }
    clearedSound(rw.clip !== undefined ? rw.clip : ai, endless ? 1 : last ? NR + 1 : from + 1, last);
    let moved = false;
    const go = () => {
      if (moved) return;
      moved = true; clearTimers();
      if (endless) nextQuestion(); else if (last) showWin(true); else showAdvance(from);
    };
    puz.explode().then(() => later(go, 350));
    later(go, Math.max(rw.scene ? 6500 : 4000, ((puz && puz.finaleMs) || 0) + 2500)); // safety net if the browser pauses animation (tab in the background)
  }

  // ---------- screens ----------
  function setHeader() {
    $('#who').textContent = state && view !== 'start' ? state.name : '';
    $('#btnReport').hidden = !state || view === 'start';
    $('#btnSound').textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
    $('#btnSound').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  }
  function dropShell() { if (puz) { puz.destroy(); puz = null; } main.classList.remove('wide'); }
  // The play screen keeps the puzzle alive between questions so its animations are never cut off.
  function ensureShell() {
    const layout = mqSide.matches ? 'side' : 'top', ai = artIndex(), key = layout + '|' + ai;
    main.classList.add('wide');
    if (puz && puzKey === key && main.querySelector('#qcol')) return;
    if (puz) puz.destroy();
    main.innerHTML = '<div class="play lay-' + layout + '"><div id="hud"></div><div class="cols"><div id="qcol"></div>' +
      '<aside class="card puzzle" id="puzzlePanel"><div id="puzzleHost"></div><p class="pcount" id="pcount" aria-live="polite"></p></aside></div></div>';
    const rw = REWARDS[ai];
    puz = rw.scene
      ? Scenes.create($('#puzzleHost'), { scene: rw.scene, steps: NP, layout, placed: state.placed, reduced: reducedMotion(), seed: 5 + 3 * ai })
      : Puzzle.create($('#puzzleHost'), { art: rw.art, cols: PZ.cols, rows: PZ.rows, layout, placed: state.placed, reduced: reducedMotion(), shapeSeed: 11 + 7 * ai, seed: 5 + 3 * ai });
    puzKey = key;
  }
  function showCount() { $('#pcount').innerHTML = '<b>' + state.placed.length + '</b> of ' + NP + ' ' + esc(reward().progress); }

  function renderStart() {
    view = 'start'; clearTimers(); overlay.hidden = true; dropShell();
    const inN = PZ.perCorrect === 1 ? 'a piece' : PZ.perCorrect + ' pieces', outN = PZ.perMiss === 1 ? 'a piece' : PZ.perMiss + ' pieces';
    main.innerHTML =
      '<section class="card start">' +
      '<p class="eyebrow">' + esc(C.subtitle) + '</p>' +
      '<h1>' + esc(C.title) + '</h1>' +
      '<p class="lede">Climb ' + NR + ' rounds of multiple-choice questions. Every round mixes all the topics, and each round is harder than the last.</p>' +
      '<ul class="rules">' +
      (REWARDS.some(r => r.scene)
        ? '<li>Every round has its own ' + esc(PUZZLE_ART_SET.theme) + ' scene to finish, in <b>' + NP + '</b> steps: ' + esc(listWords(Array.from(new Set(REWARDS.slice(0, NR).map(r => r.blurb))))) + '.</li>' +
          '<li>Each correct answer moves your scene one step forward. Each miss moves it one step back, and you will see the worked solution before moving on.</li>'
        : '<li>Every round has its own ' + esc(PUZZLE_ART_SET.theme) + ' picture puzzle. Each correct answer puts <b>' + inN + '</b> into place.</li>' +
          '<li>Each miss knocks <b>' + outN + '</b> back out to the pile, and you will see the worked solution before moving on.</li>' +
          '<li>Finish all <b>' + NP + '</b> pieces to clear the round.</li>') +
      '<li>Your progress is saved on this computer, so a refresh will not erase it.</li>' +
      (SWAP ? '<li>Stay in the game while you work: if you switch to another tab or app, or reload the page, you will get a new problem when you come back.</li>' : '') +
      (S.blockCopy ? '<li>Copying the questions is turned off.</li>' : '') +
      (S.rules || []).map(r => '<li>' + r + '</li>').join('') +            // extra rule lines a content pack can add (trusted markup)
      '</ul>' +
      '<form id="startForm" autocomplete="off">' +
      '<label for="name">Your name (first and last)</label>' +
      '<div class="row"><input id="name" type="text" maxlength="40" required><button class="primary" type="submit">Start Round 1</button></div>' +
      '</form>' +
      '<ol class="ladder">' + C.rounds.map((r, i) => '<li><span class="pip">' + (i + 1) + '</span><span><b>' + esc(r.name) + '</b><br><small>' + esc(r.blurb) + '</small></span></li>').join('') + '</ol>' +
      '</section>';

    $('#startForm').addEventListener('submit', ev => {
      ev.preventDefault();
      const name = $('#name').value.trim().replace(/\s+/g, ' ');

  }

  function hudHTML() {
    if (state.mode === 'endless') {
      const e = state.endless;
      return '<section class="hud endless"><div class="hud-row"><div class="roundname"><b>Challenge Mode</b><span>All ' + NR + ' rounds cleared</span></div>' +
        '<div class="streaks"><span class="tile"><small>Streak</small><b>' + e.streak + '</b></span><span class="tile"><small>Best</small><b>' + e.best + '</b></span>' +
        '<span class="tile"><small>Puzzles</small><b>' + (e.puzzles || 0) + '</b></span></div></div></section>';
    }
    const r = state.round;
    const pips = C.rounds.map((_, i) => '<span class="pip ' + (i + 1 < r ? 'done' : i + 1 === r ? 'cur' : '') + '">' + (i + 1) + '</span>').join('');
    return '<section class="hud"><div class="hud-row"><div class="pips" aria-hidden="true">' + pips + '</div>' +
      '<div class="roundname"><b>Round ' + r + ' of ' + NR + '</b><span>' + esc(C.rounds[r - 1].name) + '</span></div></div></section>';
  }

  // animate = true right after an answer, so the puzzle piece moves; otherwise the puzzle is just shown as saved
  function renderPlay(animate) {
    view = 'play'; clearTimers(); overlay.hidden = true;
    ensureShell();
    const cur = state.cur, asking = cur.phase === 'ask';
    // short choices sit in two columns; long ones stack
    const figs = cur.choices.some(isFig);
    const longest = figs ? 0 : Math.max(...cur.choices.map(c => Math.max(...c.split('\n').map(line => rich(line).replace(/<[^>]+>/g, '').length))));
    const twoCol = longest <= 22;
    const choices = cur.choices.map((c, i) => {
      let cls = 'choice';
      if (!asking) { if (i === cur.ans) cls += ' correct'; else if (i === cur.picked) cls += ' wrong'; else cls += ' dim'; }
      else if (i === sel) cls += ' picked';
      return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (asking ? '' : ' disabled') + ' aria-pressed="' + (i === sel) + '">' +
        '<span class="key">' + 'ABCD'[i] + '</span><span class="txt">' + show(c) + '</span></button>';
    }).join('');
    let foot;
    if (asking) {
      foot = '<div class="actions"><button type="button" class="primary" id="btnSubmit"' + (sel === null ? ' disabled' : '') + '>Check answer</button>' +
        '<span class="hint">Pick with the mouse or keys A–D, then press Enter.</span></div>';
    } else if (cur.phase === 'right') {
      const k = (cur.added || []).length;
      const rw = reward(), msg = cur.cleared ? 'Correct! That finishes the ' + rw.label + '.' : 'Correct! ' + rw.gain(k);
      foot = '<div class="feedback good" role="status"><b>' + esc(msg) + '</b></div>' +
        '<div class="actions"><button type="button" class="primary" id="btnNext">' + (cur.cleared ? esc(reward().doneShort) : 'Next question') + '</button></div>';
    } else {
      const k = (cur.removed || []).length;
      const lost = 'Not quite. ' + (k === 0 ? reward().none : reward().lose(k));
      foot = '<div class="feedback bad" role="status"><b>' + esc(lost) + '</b>' +
        '<p class="fb-ans">Correct answer: <span class="ansbox">' + show(cur.choices[cur.ans]) + '</span></p>' +
        '<div class="why"><h3>Here is how</h3>' + cur.why.map(w => '<p>' + rich(w) + '</p>').join('') + '</div></div>' +

    }

      (asking && cur.swapNote ? '<p class="swapnote" role="status">' + esc(cur.swapNote) + '</p>' : '') +
      '<div class="prompt">' + rich(cur.q) + '</div>' + (cur.fig ? '<div class="qfig">' + cur.fig + '</div>' : '') +
      '<div class="choices' + (twoCol ? ' two' : '') + (figs ? ' figs' : '') + '">' + choices + '</div>' + foot +
      '</section>';
    // move the puzzle pieces for this answer

      (cur.added || []).forEach((i, n) => puz.place(i, n * 260));

    }
    const shown = puz.placedList();
    if (shown.length !== state.placed.length || shown.some(i => !state.placed.includes(i))) puz.sync(state.placed);
    showCount();
    setHeader();
    if (asking) { RGActivity.start(cur, save); return; }
    const next = $('#btnNext');
    if (cur.phase === 'right') {
      next.focus();
      later(proceed, cur.cleared ? 1700 : 1250);
    } else {
      let left = S.missPauseSeconds;
      const tick = () => {
        if (left <= 0) { next.disabled = false; next.textContent = 'Next question'; next.focus(); return; }
        next.textContent = 'Next question (' + left + ')'; left--; later(tick, 1000);
      };
      tick();
    }
  }

  function pct(right, wrong) { const n = right + wrong; return n ? Math.round((right / n) * 100) : null; }
  function reportHTML() {
    const t = state.total, n = t.right + t.wrong, acc = pct(t.right, t.wrong);
    const status = state.won ? 'All ' + NR + ' rounds cleared' : 'Round ' + state.round + ' of ' + NR;
    const sub = state.won ? 'Finished the ladder' : 'In progress: ' + state.placed.length + ' of ' + NP + ' steps';
    const mins = Math.max(0, Math.round(state.timeMs / 60000));
    const resets = Number(store.get(KEY_RESETS) || 0);
    const when = new Date().toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    const topics = C.topics.map(tp => {
      const s = state.topics[tp.key], p = pct(s.right, s.wrong);

    }).join('');

      return '<li class="' + (cleared ? 'done' : here ? 'cur' : '') + '"><span class="pip">' + (i + 1) + '</span><span class="rn">' + esc(r.name) + '</span>' +
        '<span class="rs">' + (cleared ? 'Cleared' : here ? 'In progress' : 'Locked') + (s.right + s.wrong ? ' · ' + s.right + ' right, ' + s.wrong + ' missed' : '') + '</span></li>';
    }).join('');
    const e = state.endless;
    return '<div class="report">' +
      '<div class="rhead"><div><p class="eyebrow">' + esc(C.title) + ' · ' + esc(C.subtitle) + '</p><h2>' + esc(state.name) + '</h2><p class="when">' + esc(when) + '</p></div>' +
      '<div class="rstatus"><b>' + status + '</b><span>' + sub + '</span></div></div>' +
      '<div class="tiles">' +
      '<div class="tile"><small>Questions answered</small><b>' + n + '</b></div>' +
      '<div class="tile"><small>Correct</small><b>' + t.right + '</b></div>' +
      '<div class="tile"><small>Accuracy</small><b>' + (acc === null ? '–' : acc + '%') + '</b></div>' +
      '<div class="tile"><small>Time working</small><b>' + mins + ' min</b></div>' +
      '</div>' +
      '<h3>Accuracy by topic</h3><div class="topics">' + topics + '</div>' +
      '<h3>Rounds</h3><ol class="rlist">' + rounds + '</ol>' +
      (e.right + e.wrong ? '<p class="extra">Challenge Mode: best streak <b>' + e.best + '</b>, extra puzzles finished <b>' + (e.puzzles || 0) + '</b> (' + e.right + ' right, ' + e.wrong + ' missed)</p>' : '') +
      (resets ? '<p class="extra">Times restarted: <b>' + resets + '</b></p>' : '') +
      '</div>';
  }

  // ---------- the results code students paste into Canvas ----------
  function resultsHTML() {
    return '<section class="results" aria-labelledby="resTitle"><h3 id="resTitle">Turn in your results</h3>' +
      '<p>When your teacher says to, copy your results code and paste it into the <b>Review Game</b> assignment in Canvas. ' +
      'You can turn in a newer code later; Canvas keeps the newest one.</p>' +
      '<div class="actions"><button type="button" class="primary" id="btnCode">Copy my results code</button><span id="codeMsg" class="copied" role="status"></span></div>' +
      '<p id="codeHelp" class="muted" hidden></p><div id="codeBox" class="codebox" hidden tabindex="0"></div></section>';
  }
  function oldCopy(text) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta); return ok;
  }
  function wireResults() {
    const btn = $('#btnCode'); if (!btn) return;
    const box = $('#codeBox');
    const selectBox = () => { try { const r = document.createRange(); r.selectNodeContents(box); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* select by hand */ } };
    box.addEventListener('click', selectBox); box.addEventListener('focus', selectBox);
    btn.addEventListener('click', () => {
      const code = how => RGResults.make(C, state, { resets: Number(store.get(KEY_RESETS) || 0), best: Math.max(bestSoFar(), state.won ? NR + 1 : state.round), copy: how });
      const finish = (how, text) => {
        box.textContent = text; box.hidden = false;
        $('#codeMsg').textContent = how === 'hand' ? '' : 'Copied!';
        const help = $('#codeHelp'); help.hidden = false;
        help.textContent = how === 'hand'
          ? 'This browser blocks the copy button. Click the code below to select it, copy it (Ctrl+C, or Cmd+C on a Mac), then paste it into the assignment in Canvas and click Submit.'
          : 'Now paste it into the assignment\'s text box in Canvas and click Submit. If pasting gives you nothing, click the code below to select it and copy it by hand.';
        if (how === 'hand') selectBox();
      };
      const older = () => { const t = code('old'); if (oldCopy(t)) finish('old', t); else finish('hand', code('hand')); };
      if (navigator.clipboard && navigator.clipboard.writeText) { const t = code('api'); navigator.clipboard.writeText(t).then(() => finish('api', t), older); }
      else older();
    });
  }

  function renderReport() {
    view = 'report'; clearTimers(); overlay.hidden = true; dropShell();
    main.innerHTML = '<section class="card">' + reportHTML() +
      resultsHTML() +
      '<div class="actions spread"><button type="button" class="primary" id="btnBack">' + (state.won && state.mode !== 'endless' ? 'Play Challenge Mode' : 'Back to the game') + '</button>' +
      '<span id="resetBox"><button type="button" class="ghost" id="btnReset">Start over</button></span></div></section>';
    setHeader();
    $('#btnBack').addEventListener('click', resume);
    wireResults();
    $('#btnReset').addEventListener('click', () => {
      $('#resetBox').innerHTML = '<span class="confirm">Erase all progress? <button type="button" class="danger" id="btnYes">Yes, start over</button> <button type="button" class="ghost" id="btnNo">Cancel</button></span>';
      $('#btnNo').addEventListener('click', renderReport);
      $('#btnYes').addEventListener('click', () => {
        store.set(KEY_RESETS, String(Number(store.get(KEY_RESETS) || 0) + 1));
        noteBest(); store.del(KEY); state = null; renderStart();
      });
    });
  }
  function resume() {
    if (state.won && state.mode !== 'endless') { state.mode = 'endless'; state.rot = { queue: [], used: {}, last: null }; state.cur = null; state.placed = []; save(); }
    if (!state.cur) return nextQuestion();
    sel = null; renderPlay();
  }

  function confetti(n) {
    if (reducedMotion()) return '';
    const colors = ['var(--brand)', 'var(--gold)', 'var(--good)', 'var(--bad)'];
    let h = '';
    for (let i = 0; i < n; i++) {
      h += '<i class="confetti" style="left:' + RG.rint(2, 98) + '%;background:' + RG.pick(colors) + ';animation-delay:' + (RG.rint(0, 60) / 100) + 's;animation-duration:' + (RG.rint(160, 280) / 100) + 's;transform:rotate(' + RG.rint(0, 360) + 'deg)"></i>';
    }
    return h;
  }
  // Shown after the puzzle has burst apart; the pieces are already back in the pile behind it.
  function showAdvance(from) {
    view = 'advance'; clearTimers();
    ensureShell();
    const r = state.round, rs = state.rounds[from - 1];
    $('#hud').innerHTML = hudHTML(); $('#qcol').innerHTML = '';
    puz.sync(state.placed); showCount();
    overlay.innerHTML = confetti(48) +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="advTitle">' +
      '<p class="eyebrow">Round ' + from + ' cleared</p>' +
      '<h2 id="advTitle">Round ' + r + '</h2>' +
      '<p class="big">' + esc(C.rounds[r - 1].name) + '</p>' +
      '<p class="muted">' + esc(C.rounds[r - 1].blurb) + '. You answered ' + rs.right + ' right and missed ' + rs.wrong + ' in the last round.</p>' +
      '<button type="button" class="primary" id="btnGo">Start Round ' + r + '</button></div>';
    overlay.hidden = false;
    setHeader();
    $('#btnGo').addEventListener('click', () => { overlay.hidden = true; overlay.innerHTML = ''; nextQuestion(); });
    $('#btnGo').focus();
    sayAfterSound('Round ' + r + '!');
  }
  function showWin(celebrate) {
    view = 'win'; clearTimers(); overlay.hidden = true; dropShell();
    main.innerHTML = '<section class="card win">' + (celebrate ? '<div class="burst">' + confetti(70) + '</div>' : '') +
      '<p class="eyebrow">Ladder complete</p><h1>You cleared all ' + NR + ' rounds!</h1>' + reportHTML() +
      resultsHTML() +
      '<div class="actions"><button type="button" class="primary" id="btnEndless">Keep going: Challenge Mode</button></div></section>';
    setHeader();
    $('#btnEndless').addEventListener('click', resume);
    wireResults();
    window.scrollTo(0, 0);
    if (celebrate) sayAfterSound('You did it! All ' + NR + ' rounds complete!');
  }

  // ---------- events ----------
  main.addEventListener('click', ev => {
    const ch = ev.target.closest('.choice');
    if (ch && view === 'play' && state.cur.phase === 'ask') {
      sel = Number(ch.dataset.i);
      main.querySelectorAll('.choice').forEach((b, i) => { b.classList.toggle('picked', i === sel); b.setAttribute('aria-pressed', i === sel); });
      $('#btnSubmit').disabled = false;
      return;
    }
    if (view !== 'play') return;
    if (ev.target.id === 'btnSubmit') return submit();
    if (ev.target.id === 'btnNext' && !ev.target.disabled) return proceed();
  });
  document.addEventListener('keydown', ev => {
    if (view !== 'play' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const cur = state.cur, k = ev.key.toLowerCase();
    if (cur.phase === 'ask') {
      const idx = 'abcd'.indexOf(k) >= 0 && k.length === 1 ? 'abcd'.indexOf(k) : '1234'.indexOf(k) >= 0 && k.length === 1 ? '1234'.indexOf(k) : -1;
      if (idx >= 0 && idx < cur.choices.length) {
        sel = idx;
        main.querySelectorAll('.choice').forEach((b, i) => { b.classList.toggle('picked', i === sel); b.setAttribute('aria-pressed', i === sel); });
        $('#btnSubmit').disabled = false;
        ev.preventDefault();
      } else if (k === 'enter' && sel !== null) { ev.preventDefault(); submit(); }
    } else if (k === 'enter') {
      const next = $('#btnNext');
      if (next && !next.disabled) { ev.preventDefault(); proceed(); }
    }
  });
  $('#btnSound').addEventListener('click', () => {
    soundOn = !soundOn; store.set(KEY_SOUND, soundOn ? 'on' : 'off');
    if (!soundOn) { try { window.speechSynthesis.cancel(); } catch (e) { /* none */ } try { if (SFX && SFX.stop) SFX.stop(); } catch (e) { /* none */ } }
    setHeader();
  });
  $('#btnReport').addEventListener('click', () => { if (state && view !== 'advance') { if (view === 'report') resume(); else renderReport(); } });
  // switching between wide and narrow windows moves the puzzle beside or above the question
  const relayout = () => { if (view === 'play' && state && state.cur) renderPlay(); };
  if (mqSide.addEventListener) mqSide.addEventListener('change', relayout); else if (mqSide.addListener) mqSide.addListener(relayout);

  // ---------- leaving the game: a new problem when the student comes back ----------
  if (SWAP) {
    let awayAt = 0, wasHidden = false;
    const asking = () => view === 'play' && state && state.cur && state.cur.phase === 'ask';
    const gone = () => document.visibilityState === 'hidden' || (typeof document.hasFocus === 'function' && !document.hasFocus());
    const check = () => {
      if (!asking()) { awayAt = 0; wasHidden = false; return; }
      if (gone()) {
        if (!awayAt) awayAt = Date.now();
        if (document.visibilityState === 'hidden') wasHidden = true;
        return;
      }
      if (awayAt && (wasHidden || Date.now() - awayAt >= SWAP.awaySeconds * 1000)) {
        swapQuestion('You left the game, so here is a new problem of the same kind.');
      }
      awayAt = 0; wasHidden = false;
    };
    document.addEventListener('visibilitychange', check);
    window.addEventListener('blur', check);
    window.addEventListener('focus', check);
  }
  // ---------- copying the question is turned off (attempts are still counted by RGActivity) ----------
  if (S.blockCopy) {
    const inQuestion = ev => view === 'play' && !!(ev.target && ev.target.closest && ev.target.closest('.question'));
    document.addEventListener('copy', ev => { if (view === 'play') { ev.preventDefault(); try { ev.clipboardData.setData('text/plain', ''); } catch (e) { /* none */ } } });
    document.addEventListener('cut', ev => { if (view === 'play') ev.preventDefault(); });
    document.addEventListener('contextmenu', ev => { if (inQuestion(ev)) ev.preventDefault(); });
    document.addEventListener('dragstart', ev => { if (inQuestion(ev)) ev.preventDefault(); });
    document.addEventListener('selectstart', ev => { if (inQuestion(ev)) ev.preventDefault(); });
  }

  // ---------- start up ----------
  document.title = C.title + ' · ' + C.subtitle;
  $('#brandTitle').textContent = C.title;
  $('#brandSub').textContent = C.subtitle;
  state = load();
  if (!state) renderStart();
  else if (state.won && state.mode !== 'endless') showWin(false);
  else if (!state.cur) nextQuestion();
  else if (SWAP && state.cur.phase === 'ask') { view = 'play'; swapQuestion('You reloaded the game, so here is a new problem of the same kind.'); }
  else renderPlay();
})();
</script>
</body>
</html>
