<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Game</title>
<!--
  Stand-alone review game. Everything is in this one file; it needs no internet connection.
  The file has five script blocks:
    1. HELPERS         math display and polynomial tools (shared)
    2. CONTENT PACK    the questions for one set of material   <- replace this block for new material
    3. PUZZLE PICTURES the images the jigsaws are cut from     <- replace this block for new pictures
    4. JIGSAW PUZZLE   cuts the picture into pieces and animates them (shared)
    5. GAME ENGINE     rounds, puzzle scoreboard, saving, sound (shared)
-->
<style>
/* Autumn palette: cream paper, pumpkin orange, olive, cranberry, goldenrod, on a chestnut header. */
:root {
  --bg: #f8eedb; --card: #fffaf0; --ink: #3a2212; --muted: #7b5a41; --line: #e3cfab;
  --brand: #b4470f; --brand-ink: #fff8ea; --brand-soft: #fbdfbd;
  --good: #4c7524; --good-soft: #e4edcb; --bad: #a32d26; --bad-soft: #f8ddd3; --gold: #d2921a;
  --pz: #f3e3c4;
  --hdr: #4a2512; --hdr-ink: #fdf1dc; --hdr-muted: #e2c39c; --hdr-line: rgba(253, 241, 220, .35);
  --shadow: 0 1px 2px rgba(74, 37, 18, .08), 0 8px 24px rgba(74, 37, 18, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b120b; --card: #291b11; --ink: #f7ead6; --muted: #c9ab8a; --line: #4b3524;
    --brand: #f08a3a; --brand-ink: #24130a; --brand-soft: #4c2c16;
    --good: #a9cc6c; --good-soft: #2b3619; --bad: #ff927c; --bad-soft: #4a2018; --gold: #f2c14e;
    --pz: #3d2b1c;
    --hdr: #120b06; --hdr-ink: #f7ead6; --hdr-muted: #c9ab8a; --hdr-line: rgba(247, 234, 214, .3);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
button, input { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--hdr); color: var(--hdr-ink);
  border-bottom: 4px solid; border-image: linear-gradient(90deg, #8f2a22, #c9531a 30%, #e0a021 60%, #6b8a2e) 1;
}
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-size: 1.05rem; letter-spacing: .01em; }
.brand span { color: var(--hdr-muted); font-size: .92rem; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#who { color: var(--hdr-muted); font-size: .92rem; margin-right: 4px; }
.top button, .ghost {
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem;
}
.top button { border-color: var(--hdr-line); }
.top button:hover { border-color: #f2c14e; color: #f2c14e; }
.ghost:hover { border-color: var(--brand); color: var(--brand); }

main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
main.wide { max-width: 1260px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; box-shadow: var(--shadow); position: relative; }
.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: .78rem; font-weight: 700; color: var(--brand); }
h1 { font-size: 2rem; line-height: 1.15; margin: 4px 0 10px; text-wrap: balance; }
h2 { font-size: 1.5rem; line-height: 1.2; }
h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 10px; }
.lede { color: var(--muted); max-width: 60ch; }
.muted { color: var(--muted); }

button.primary {
  background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; cursor: pointer;
}
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.primary:disabled { opacity: .45; cursor: not-allowed; }
button.danger { background: var(--bad); color: var(--card); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; font-weight: 700; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* start screen */
.rules { margin: 16px 0 20px; padding-left: 20px; }
.rules li { margin: 4px 0; }
.start label { display: block; font-weight: 700; margin-bottom: 6px; }
.start .row { display: flex; gap: 10px; flex-wrap: wrap; }
.start input { flex: 1 1 240px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); }
.ladder { list-style: none; margin: 26px 0 0; padding: 18px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.ladder li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.25; }
.ladder small { color: var(--muted); }

.pip {
  display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%;
  border: 2px solid var(--line); color: var(--muted); font-weight: 700; font-size: .9rem; background: var(--card);
}
.pip.done { background: var(--good); border-color: var(--good); color: var(--card); }
.pip.cur { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

/* heads-up display */
.hud { margin-bottom: 14px; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.pips { display: flex; gap: 8px; }
.roundname { display: flex; align-items: baseline; gap: 10px; }
.roundname b { font-size: 1.1rem; }
.roundname span { color: var(--muted); }
.streaks { display: flex; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; display: flex; flex-direction: column; min-width: 86px; }
.tile small { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
.tile b { font-size: 1.45rem; line-height: 1.2; }

/* play layout: question beside the puzzle on wide screens, puzzle on top on narrow ones */
.play .cols { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; align-items: start; }
.play.lay-top .cols { grid-template-columns: minmax(0, 1fr); }
.puzzle { padding: 14px 14px 10px; position: sticky; top: 12px; z-index: 2; }
.play.lay-top .puzzle { order: -1; position: relative; top: 0; width: 100%; max-width: 620px; margin: 0 auto; }
.pcount { text-align: center; color: var(--muted); font-size: .95rem; margin-top: 6px; }
.pcount b { color: var(--ink); font-size: 1.2rem; }
.pz { display: block; width: 100%; height: auto; overflow: visible; }
.pz-board { fill: var(--pz); stroke: var(--line); }
.pz-slot { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.pz-pile { fill: var(--pz); stroke: var(--line); stroke-dasharray: 5 4; }
.pz-edge { fill: none; stroke: rgba(18, 8, 30, .62); stroke-width: 1.1; stroke-linejoin: round; }
.pz-snap .pz-edge { animation: pzsnap .55s ease-out; }
.pz-lift { filter: drop-shadow(0 5px 4px rgba(40, 20, 6, .35)); }
.pz-flash { fill: #ffd76a; opacity: 0; pointer-events: none; transform-box: fill-box; transform-origin: center; }
.pz-flash.go { animation: pzflash .65s ease-out; }
.puzzle.boom { animation: pzshake .5s ease-out; }
@keyframes pzsnap { 0% { stroke: #ffd76a; stroke-width: 5; } 100% { stroke: rgba(18, 8, 30, .62); stroke-width: 1.1; } }
@keyframes pzflash { 0% { opacity: .95; transform: scale(.4); } 100% { opacity: 0; transform: scale(20); } }
@keyframes pzshake {
  0%, 100% { transform: none; } 15% { transform: translate(-6px, 3px) rotate(-.7deg); } 30% { transform: translate(6px, -3px) rotate(.7deg); }
  45% { transform: translate(-4px, -2px); } 60% { transform: translate(4px, 2px); } 80% { transform: translate(-2px, 1px); }
}

/* question */
.chip { display: inline-block; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: .8rem; padding: 3px 12px; border-radius: 999px; }
.prompt { font-size: 1.18rem; margin: 14px 0 20px; line-height: 1.9; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
.prompt .math { font-size: 1.2em; }
.choices { display: grid; gap: 10px; }
.choices.two { grid-template-columns: 1fr 1fr; }
/* graphs drawn by the content pack: one under the prompt, or one per choice */
.qfig { margin: -6px 0 18px; }
.qfig svg { display: block; width: 100%; max-width: 340px; height: auto; }
.gchoice svg { display: block; width: 150px; max-width: 100%; height: auto; }
.choices.figs .choice { padding: 8px 12px; }
.gf-bg { fill: var(--card); }
.gf-grid { stroke: var(--line); stroke-width: 1; }
.gf-axis { stroke: var(--muted); stroke-width: 1.6; }
.gf-tick { fill: var(--muted); font: 11px system-ui, sans-serif; }
.gf-curve { fill: none; stroke: var(--brand); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.ansbox .gchoice { display: inline-block; vertical-align: middle; }
.choice {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
  background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 16px; min-height: 60px;
  transition: border-color .12s, background .12s, transform .08s;
}
.choice:hover:not(:disabled) { border-color: var(--brand); }
.choice:active:not(:disabled) { transform: scale(.995); }
.choice .key { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--bg); color: var(--muted); font-weight: 700; font-size: .9rem; }
.choice .txt { font-size: 1.08rem; line-height: 1.7; overflow-x: auto; overflow-y: hidden; }
.choice.picked { border-color: var(--brand); background: var(--brand-soft); }
.choice.picked .key { background: var(--brand); color: var(--brand-ink); }
.choice:disabled { cursor: default; color: inherit; }
.choice.correct { border-color: var(--good); background: var(--good-soft); }
.choice.correct .key { background: var(--good); color: var(--card); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .key { background: var(--bad); color: var(--card); }
.choice.dim { opacity: .55; }
.actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; }
.actions.spread { justify-content: space-between; }
.hint { color: var(--muted); font-size: .88rem; }
.feedback { margin-top: 18px; border-radius: 14px; padding: 14px 18px; border: 1px solid transparent; }
.feedback > b { font-size: 1.1rem; white-space: pre-wrap; }
.feedback.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.feedback.bad > b { color: var(--bad); }
.fb-ans { margin-top: 8px; }
.ansbox { display: inline-block; vertical-align: middle; font-weight: 700; line-height: 1.7; }
.why h3 { margin: 12px 0 4px; }
.why p { margin: 4px 0; line-height: 1.9; overflow-x: auto; overflow-y: hidden; }

/* report */
.rhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.when { color: var(--muted); font-size: .92rem; }
.rstatus { background: var(--brand-soft); border-radius: 12px; padding: 10px 16px; text-align: right; display: flex; flex-direction: column; }
.rstatus b { color: var(--brand); font-size: 1.15rem; }
.rstatus span { color: var(--muted); font-size: .88rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
.tiles .tile { background: var(--bg); }
.trow { display: grid; grid-template-columns: minmax(150px, 1.1fr) 1.4fr minmax(120px, auto); align-items: center; gap: 12px; padding: 6px 0; }
.tbar { height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.tfill { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.tnum { color: var(--muted); font-size: .92rem; text-align: right; font-variant-numeric: tabular-nums; }
.rlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rlist li { display: flex; align-items: center; gap: 12px; }
.rlist li.done .pip { background: var(--good); border-color: var(--good); color: var(--card); }
.rlist li.cur .pip { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
.rlist .rn { font-weight: 700; min-width: 110px; }
.rlist .rs { color: var(--muted); font-size: .92rem; }
.extra { margin-top: 12px; color: var(--muted); }
.shot { margin-top: 20px; padding: 10px 14px; border: 1.5px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: .95rem; }
.confirm { font-size: .92rem; }
.win h1 { margin-bottom: 18px; }
.win .report { border-top: 1px solid var(--line); padding-top: 18px; }

/* overlay */
#overlay { position: fixed; inset: 0; background: rgba(38, 18, 8, .66); display: grid; place-items: center; padding: 16px; overflow: hidden; z-index: 10; }
.modal { position: relative; background: var(--card); border-radius: 20px; padding: 32px 36px; max-width: 460px; width: 100%; text-align: center; box-shadow: var(--shadow); animation: pop .35s cubic-bezier(.2, 1.3, .4, 1); }
.modal h2 { font-size: 2.6rem; margin: 6px 0 0; }
.modal .big { font-size: 1.3rem; font-weight: 700; color: var(--brand); }
.modal .muted { margin: 10px 0 20px; }
.burst { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 16px; }
.confetti { position: absolute; top: -14px; width: 13px; height: 13px; border-radius: 0 75% 0 75%; /* leaf-shaped */ opacity: .9; animation: fall 2.2s ease-in forwards; pointer-events: none; }
@keyframes fall { to { top: 105%; transform: rotate(540deg); opacity: .2; } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* math */
.math { font-family: "Cambria Math", Cambria, "STIX Two Math", "Times New Roman", Times, serif; font-size: 1.1em; white-space: nowrap; }
.math i { font-style: italic; padding-right: .04em; }
.math i.mf { padding: 0 .16em 0 .08em; }   /* italic f's hook and tail run into a neighboring ( in Cambria Math */
.math sup, .math sub { font-size: .68em; line-height: 0; position: relative; vertical-align: baseline; margin-left: .04em; }
.math sup { top: -.6em; }
.math sub { top: .3em; }
.mop { margin: 0 .25em; }
.marr { font-family: "Segoe UI Symbol", "Segoe UI", "DejaVu Sans", system-ui, sans-serif; }
.mcomma { display: inline-block; width: .32em; }
.msp { display: inline-block; width: .18em; }
.mfrac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .16em; font-size: .92em; line-height: 1.25; }
.mnum { padding: 0 .28em .1em; border-bottom: 1.5px solid currentColor; }
.mden { padding: .1em .28em 0; }
.mfrac sup { top: -.5em; }
/* radicals: an SVG sign stretched to the height of the radicand box, which carries the bar as its top border */
.msqrt { position: relative; display: inline-block; padding-left: .6em; margin: 0 .04em; white-space: nowrap; }
.msqrt.mhasidx { margin-left: .1em; }
.mrsign { position: absolute; left: 0; top: .75px; width: .62em; height: calc(100% - .75px); overflow: visible; }
.mrsign path { fill: none; stroke: currentColor; stroke-width: 1.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.msqrt .mrad { display: inline-block; border-top: 1.5px solid currentColor; padding: .14em .14em 0 .06em; line-height: 1.15; }
.mrad sup { position: static; top: auto; vertical-align: .5em; line-height: 1; }
.mrad sup.mfsup { vertical-align: .85em; }
.mrad .mfrac { margin: .08em .1em; }
.mbig { display: inline-flex; align-items: center; vertical-align: middle; border-left: 1.6px solid currentColor; border-right: 1.6px solid currentColor; border-radius: .8em / 50%; padding: .12em .12em; margin: 0 .06em; }
.mbig + sup { top: -1.5em; }
.mtext { font-family: "Segoe UI", system-ui, sans-serif; font-size: .9em; }
.mroot { font-size: .58em; position: absolute; right: calc(100% - .62em); bottom: calc(50% + .1em); line-height: 1; }
.math sup.mfsup { font-size: .6em; top: -1.55em; margin-left: .08em; }
.math sup.mfsup .mfrac { font-size: 1em; margin: 0 .02em; vertical-align: -.15em; line-height: 1.05; }
.mden:has(.mfsup) { padding-top: .55em; }
.mnum:has(.mfsup) { padding-top: .45em; }
.math sup.mfsup .mnum { padding: 0 .1em .04em; border-bottom-width: 1px; }
.math sup.mfsup .mden { padding: .04em .1em 0; }
.mbrace { margin: 0 .06em; }
.question.nocopy, .question.nocopy * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.swapnote { margin: 10px 0 0; padding: 6px 12px; border-radius: 8px; background: var(--brand-soft); color: var(--ink); font-size: .92rem; }

@media (max-width: 640px) {
  .card { padding: 20px 18px; }
  h1 { font-size: 1.6rem; }
  .choices.two { grid-template-columns: 1fr; }
  .trow { grid-template-columns: 1fr; gap: 2px; }
  .tnum { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { .choice { transition: none; } .modal, .puzzle.boom, .pz-flash.go, .pz-snap .pz-edge { animation: none; } }
@media print { .top-actions, .actions { display: none; } body { background: #fff; } .card { box-shadow: none; } }
/* results code for Canvas */
.results { margin-top: 24px; padding: 16px 20px; border: 2px dashed var(--brand); border-radius: 14px; background: var(--brand-soft); }
.results h3 { margin-top: 0; color: var(--brand); }
.results p { margin: 6px 0; }
.copied { color: var(--good); font-weight: 700; }
.codebox { margin-top: 10px; font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; user-select: all; -webkit-user-select: all; cursor: text; max-height: 9.5em; overflow: auto; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b id="brandTitle">Review Game</b><span id="brandSub"></span></div>
  <div class="top-actions">
    <span id="who"></span>
    <button type="button" id="btnReport" hidden>My progress</button>
    <button type="button" id="btnSound" aria-pressed="true">Sound: On</button>
  </div>
</header>
<main id="main"><noscript>This game needs JavaScript. Download the file and open it in a browser such as Chrome or Edge.</noscript></main>
<div id="overlay" hidden></div>
<script>
/* =====================================================================
   1. HELPERS — math display, polynomial tools, random numbers.
   Shared by every content pack. Nothing in here is specific to a unit.
   ===================================================================== */
const RG = (function () {
  'use strict';

  // ---------- random ----------
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const nz = (a, b) => { let v; do { v = rint(a, b); } while (v === 0); return v; };
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
  const letter = () => pick(['x', 'y', 't', 'm', 'n', 'p', 'k', 'w', 'z', 'r', 's', 'd', 'q', 'v']);

  // ---------- math markup -> tokens ----------
  // A small LaTeX-like language:  x^{3}  \frac{a}{b}  \sqrt{7}  \big{...}
  // \cdot \times \pm \to \infty \neq \le \ge  \text{words}  \, (thin space)
  // \sqrt[3]{x} (an nth root)  \pi  \lbrace \rbrace (set braces)
  const SYMS = { cdot: '·', times: '×', div: '÷', pm: '±', to: '→', infty: '∞', neq: '≠', le: '≤', ge: '≥', approx: '≈' };

  function tokenize(s) {
    let i = 0;
    function group() {
      if (s[i] !== '{') throw new Error('expected { at ' + i + ' in ' + s);
      i++;
      return seq('}');
    }
    function single() {
      const c = s[i];
      if (/[0-9.]/.test(c)) {
        let j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        const v = s.slice(i, j); i = j;
        return { t: 'num', v };
      }
      if (/[a-zA-Z]/.test(c)) { i++; return { t: 'var', v: c }; }
      if (c === '\\') {
        if (s[i + 1] === ',') { i += 2; return { t: 'sp' }; }
        let j = i + 1;
        while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
        const name = s.slice(i + 1, j); i = j;
        if (name === 'frac') { const num = group(); const den = group(); return { t: 'frac', num, den }; }
        if (name === 'sqrt') {
          let idx = null;
          if (s[i] === '[') { const k = s.indexOf(']', i); idx = s.slice(i + 1, k); i = k + 1; }
          return { t: 'sqrt', seq: group(), idx };
        }
        if (name === 'pi') return { t: 'pi' };
        if (name === 'lbrace' || name === 'rbrace') return { t: 'brace', v: name === 'lbrace' ? '{' : '}' };
        if (name === 'big') return { t: 'big', seq: group() };
        if (name === 'text') {
          if (s[i] !== '{') throw new Error('expected { after \\text in ' + s);
          const k = s.indexOf('}', i);
          const v = s.slice(i + 1, k); i = k + 1;
          return { t: 'text', v };
        }
        if (SYMS[name]) return { t: 'sym', v: name };
        throw new Error('unknown command \\' + name + ' in ' + s);
      }
      i++;
      return { t: 'ch', v: c };
    }
    function seq(stop) {
      const out = [];
      while (i < s.length) {
        const c = s[i];
        if (c === '}') {
          if (stop === '}') { i++; return out; }
          throw new Error('unexpected } in ' + s);
        }
        if (c === ' ') { i++; continue; }
        if (c === '^' || c === '_') {
          i++;
          const g = s[i] === '{' ? group() : [single()];
          out.push({ t: c === '^' ? 'sup' : 'sub', seq: g });
          continue;
        }
        out.push(single());
      }
      if (stop === '}') throw new Error('missing } in ' + s);
      return out;
    }
    return seq(null);
  }

  // ---------- tokens -> HTML ----------
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function renderSeq(seq) {
    let html = '';
    let operand = false; // was the previous thing something a binary operator can follow?
    for (const tk of seq) {
      switch (tk.t) {
        case 'num': html += tk.v; operand = true; break;
        case 'var': html += (tk.v === 'f' ? '<i class="mf">' : '<i>') + tk.v + '</i>'; operand = true; break;
        case 'sp': html += '<span class="msp"></span>'; break;
        case 'text': html += '<span class="mtext">' + esc(tk.v) + '</span>'; operand = true; break;
        case 'sym':
          if (tk.v === 'infty') { html += SYMS.infty; operand = true; }
          else if (tk.v === 'pm' && !operand) { html += SYMS.pm; operand = false; }
          else { html += '<span class="mop' + (tk.v === 'to' ? ' marr' : '') + '">' + SYMS[tk.v] + '</span>'; operand = false; }
          break;
        case 'ch':
          if (tk.v === '-') { html += operand ? '<span class="mop">−</span>' : '−'; operand = false; }
          else if (tk.v === '+' || tk.v === '=' || tk.v === '<' || tk.v === '>') { html += '<span class="mop">' + esc(tk.v) + '</span>'; operand = false; }
          else if (tk.v === ',') { html += ',<span class="mcomma"></span>'; operand = false; }
          else if (tk.v === '(') { html += '('; operand = false; }
          else if (tk.v === ')') { html += ')'; operand = true; }
          else { html += esc(tk.v); operand = true; }
          break;
        case 'sup': {
          // a fraction exponent (x^{2/3}, x^{-3/4}) sits higher and smaller so it can't be read as a mixed number
          const fracExp = tk.seq.some(u => u.t === 'frac');
          html += '<sup' + (fracExp ? ' class="mfsup"' : '') + '>' + renderSeq(tk.seq) + '</sup>'; operand = true; break;
        }
        case 'sub': html += '<sub>' + renderSeq(tk.seq) + '</sub>'; operand = true; break;
        case 'frac':
          html += '<span class="mfrac"><span class="mnum">' + renderSeq(tk.num) + '</span><span class="mden">' + renderSeq(tk.den) + '</span></span>';
          operand = true; break;
        // the radical sign is drawn (not a font glyph) so it stretches to the radicand and meets the bar exactly
        case 'sqrt': html += '<span class="msqrt' + (tk.idx ? ' mhasidx' : '') + '" role="img" aria-label="' + (tk.idx ? 'root ' + esc(tk.idx) + ' of' : 'square root of') + '">' + (tk.idx ? '<span class="mroot">' + esc(tk.idx) + '</span>' : '') +
          '<svg class="mrsign" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.3 12.6 L2.6 11.2 L5.6 20 L10 0"/></svg><span class="mrad">' + renderSeq(tk.seq) + '</span></span>'; operand = true; break;
        case 'pi': html += 'π'; operand = true; break;
        case 'brace': html += '<span class="mbrace">' + tk.v + '</span>'; operand = tk.v === '}'; break;
        case 'big': html += '<span class="mbig">' + renderSeq(tk.seq) + '</span>'; operand = true; break;
      }
    }
    return html;
  }
  const math = s => '<span class="math">' + renderSeq(tokenize(s)) + '</span>';
  // Text with $math$ segments; a newline becomes a line break.
  const rich = s => String(s).split('$').map((part, idx) => (idx % 2 ? math(part) : esc(part).replace(/\n/g, '<br>'))).join('');

  // ---------- polynomial tools (coefficient arrays, index = exponent) ----------
  const P = {
    trim(p) { p = p.slice(); while (p.length > 1 && p[p.length - 1] === 0) p.pop(); return p; },
    of(...highToLow) { return P.trim(highToLow.slice().reverse()); }, // P.of(3,-2,4) is 3x^2 - 2x + 4
    add(a, b) { const n = Math.max(a.length, b.length), r = []; for (let i = 0; i < n; i++) r.push((a[i] || 0) + (b[i] || 0)); return P.trim(r); },
    scale(a, k) { return P.trim(a.map(c => c * k)); },
    sub(a, b) { return P.add(a, P.scale(b, -1)); },
    mul(a, b) { const r = new Array(a.length + b.length - 1).fill(0); a.forEach((x, i) => b.forEach((y, j) => { r[i + j] += x * y; })); return P.trim(r); },
    pow(a, n) { let r = [1]; for (let i = 0; i < n; i++) r = P.mul(r, a); return r; },
    at(a, x) { let r = 0; for (let i = a.length - 1; i >= 0; i--) r = r * x + a[i]; return r; },
    deg(a) { return P.trim(a).length - 1; },
    terms(a) { const t = []; for (let i = a.length - 1; i >= 0; i--) if (a[i] !== 0) t.push([a[i], i]); return t; },
    fmt(a, v) { return fmtTerms(P.terms(a), v); },
    eq(a, b) { a = P.trim(a); b = P.trim(b); return a.length === b.length && a.every((c, i) => c === b[i]); }
  };

  // variable power:  pw('x',3) -> x^{3}
  const pw = (v, e) => (e === 0 ? '' : e === 1 ? v : v + '^{' + e + '}');
  // one term:  mono(-3,2,'x') -> -3x^{2}
  function mono(c, e, v = 'x') {
    if (e === 0) return String(c);
    const vs = pw(v, e);
    if (c === 1) return vs;
    if (c === -1) return '-' + vs;
    return c + vs;
  }
  // terms in the order given: [[coef, exp], ...]  (use for non-standard order)
  function fmtTerms(terms, v = 'x') {
    const ts = terms.filter(t => t[0] !== 0);
    if (!ts.length) return '0';
    return ts.map((t, i) => (i > 0 && t[0] > 0 ? '+' : '') + mono(t[0], t[1], v)).join('');
  }
  // linear factor (ax+b), optionally to a power
  const fac = (a, b, v = 'x', power) => '(' + fmtTerms([[a, 1], [b, 0]], v) + ')' + (power && power > 1 ? '^{' + power + '}' : '');
  // product of monic linear factors (x+c); repeated ones become powers
  function facs(consts, v = 'x') {
    const sorted = consts.slice().sort((a, b) => b - a);
    let out = '';
    for (let i = 0; i < sorted.length;) {
      let j = i;
      while (j < sorted.length && sorted[j] === sorted[i]) j++;
      out += fac(1, sorted[i], v, j - i);
      i = j;
    }
    return out;
  }
  // decimal from a scaled integer: dec(135, 2) -> "1.35"
  function dec(n, places) {
    const neg = n < 0; n = Math.abs(n);
    let s = String(n).padStart(places + 1, '0');
    let whole = s.slice(0, s.length - places), frac = s.slice(s.length - places).replace(/0+$/, '');
    return (neg ? '-' : '') + whole + (frac ? '.' + frac : '');
  }
  // solution list:  sol([4,0,-4]) -> $x = -4, 0, 4$
  const sol = (list, v = 'x') => '$' + v + ' = ' + list.slice().sort((a, b) => a - b).join(', ') + '$';
  const M = s => '$' + s + '$';
  // signed number with explicit plus:  signed(5) -> +5
  const signed = n => (n >= 0 ? '+' : '') + n;

  // ---------- turn a template into a question with four choices ----------
  const key = s => String(s).replace(/\s+/g, '');
  function build(template) {
    for (let tries = 0; tries < 40; tries++) {
      const g = typeof template.gen === 'function' ? template.gen() : template;
      // each wrong choice keeps the mistake behind it: its own m, or the template's mis list in the same order as d
      let ds = g.d.map((d, i) => (d == null ? null : { t: typeof d === 'string' ? d : d.t, m: (typeof d === 'object' && d.m) || (template.mis && template.mis[i]) || null })).filter(Boolean);
      if (typeof template.gen !== 'function') ds = shuffle(ds);
      const seen = new Set([key(g.a)]);
      const chosen = [];
      for (const d of ds) {
        if (!seen.has(key(d.t))) { seen.add(key(d.t)); chosen.push(d); }
        if (chosen.length === 3) break;
      }
      if (chosen.length < 3) continue;
      const order = shuffle([{ t: g.a, m: null }].concat(chosen));
      const choices = order.map(c => c.t);
      return {
        id: template.id, topic: template.topic, q: g.q, fig: g.fig || null, choices, tags: order.map(c => c.m),
        ans: choices.indexOf(g.a), why: [].concat(g.why || []),
        _raw: g
      };
    }
    throw new Error('Could not build a question from template ' + template.id);
  }

  return { rint, pick, shuffle, nz, gcd, letter, tokenize, math, rich, esc, P, pw, mono, fmtTerms, fac, facs, dec, sol, M, signed, build, SYMS };
})();
/* =====================================================================
   1b. RESULTS CODE — packs a student's game into a short code to paste into
   a Canvas text-entry assignment. Shared by every game; the teacher's script
   (review_game_results.py) reads it back with the game's catalog.

   Code:  RG1~<data>~<check>
     data  = the results as JSON, packed into letters, digits, - and _
     check = 7 characters (FNV-1a, 32-bit, base 36) that catch a damaged code
   The answer log inside the data is 6 characters per answer:
     template number (2) | mistake number (2; 0 = right) | round (1; 0 = Challenge Mode) | seconds (1, 63 = a minute or more)
   Seconds are the time the page was in front of the student. The ac field adds what happened around each
   answer (left the page, time away, copies, reloads); codes from before it was added simply lack it.
   Template and mistake numbers are positions in the content pack's questions
   and mistakes lists, so bump the content pack's version whenever those change.
   ===================================================================== */
const RGResults = (function () {
  'use strict';
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  const two = n => A[(n >> 6) & 63] + A[n & 63];
  const pack = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  function check(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ('0000000' + (h >>> 0).toString(36)).slice(-7); }

  // one log entry for an answer: [template number, mistake number, round, seconds]
  function entry(content, templateId, mistake, round, ms) {
    const qi = content.questions.findIndex(q => q.id === templateId);
    const mi = mistake ? Object.keys(content.mistakes || {}).indexOf(mistake) + 1 : 0;
    return [qi < 0 ? 4095 : qi, mistake && mi <= 0 ? 4095 : mi, Math.max(0, Math.min(63, round)), Math.max(0, Math.min(63, Math.round(ms / 1000)))];
  }
  const packLog = log => log.map(e => two(e[0]) + two(e[1]) + A[e[2]] + A[e[3]]).join('');

  // what kind of computer and browser this is, the same way the tech check reports it
  function device() {
    const ua = navigator.userAgent || '', ver = re => { const m = re.exec(ua); return m ? ' ' + m[1] : ''; };
    const os = /CrOS/.test(ua) ? 'ChromeOS' : /iPhone|iPod/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' :
      /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Macintosh|Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Unknown';
    const br = /Edg\//.test(ua) ? 'Edge' + ver(/Edg\/(\d+)/) : /OPR\//.test(ua) ? 'Opera' + ver(/OPR\/(\d+)/) : /Firefox\//.test(ua) ? 'Firefox' + ver(/Firefox\/(\d+)/) :
      /Chrome\//.test(ua) ? 'Chrome' + ver(/Chrome\/(\d+)/) : /Safari\//.test(ua) ? 'Safari' + ver(/Version\/(\d+)/) : 'Unknown';
    return { os, br, open: location.protocol === 'file:' ? 'file' : 'web' };
  }

  // st.acts[i] = activity for answer i (see RGActivity below): {lv, aw (seconds away), cp, rl}
  function activitySummary(acts) {
    const tot = { lv: 0, aw: 0, cp: 0, rl: 0 }, rows = [];
    acts.forEach((a, i) => {
      if (!a) return;
      tot.lv += a.lv; tot.aw += a.aw; tot.cp += a.cp; tot.rl += a.rl;
      if (a.lv || a.cp || a.rl || a.aw >= 2) rows.push([i, a.lv, a.aw, a.cp, a.rl].join('.'));
    });
    return [tot.lv, tot.aw, tot.cp, tot.rl].join('.') + (rows.length ? ';' + rows.join(';') : '');
  }
  // The whole code for a saved game state. extra: { resets, best, copy }
  function make(content, st, extra) {
    extra = extra || {};
    const d = device(), e = st.endless || {};
    const o = {
      v: 1, g: content.id, gv: content.version, n: st.name,
      r: st.round, w: st.won ? 1 : 0, m: st.mode === 'endless' ? 1 : 0, p: (st.placed || []).length,
      t: Math.round((st.timeMs || 0) / 60000), rs: extra.resets || 0, b: extra.best || st.round,
      e: [e.right || 0, e.wrong || 0, e.best || 0, e.puzzles || 0],
      s: Math.floor((st.startedAt || 0) / 60000), when: Math.floor(Date.now() / 60000),
      os: d.os, br: d.br, open: d.open, copy: extra.copy || '',
      log: packLog(st.log || []),
      // activity: totals, then per answer (answer number.left page.seconds away.copies.reloads) where any happened
      ac: activitySummary(st.acts || [])
    };
    // new problems given after leaving the game: total, then answer number.count where any happened
    const sw = (st.acts || []).map((x, i) => (x && x.sw ? i + '.' + x.sw : null)).filter(Boolean);
    if (st.swaps || sw.length) o.sw = (st.swaps || 0) + (sw.length ? ';' + sw.join(';') : '');
    const data = pack(JSON.stringify(o));
    return 'RG1~' + data + '~' + check(data);
  }
  return { entry, make, check, A };
})();

/* ---------------------------------------------------------------------
   ACTIVITY TRACKER — how long a question was really worked on, and what
   happened around it. Shared by the review game and the homework pages.
   While a question is waiting for an answer it keeps, on the question itself
   (so it is saved, and survives a refresh or closing and reopening the file):
     ms    time the page was in front of the student (visible and focused)
     away  time with the page hidden, in another tab or app, or the computer asleep
     lv    how many times the student left the page (switched tab, window or app)
     cp    how many times text was copied from the page
     rl    how many times the page was reloaded or reopened on this question
   --------------------------------------------------------------------- */
const RGActivity = (function () {
  'use strict';
  if (typeof document === 'undefined') return { start() {}, pause() {}, finish(q) { return { ms: 0, away: 0, lv: 0, cp: 0, rl: 0 }; } };   // not in a browser (offline tests)
  const PAGE = Math.random().toString(36).slice(2, 10);   // this page load
  const MAX_GAP = 10 * 60 * 1000;                          // a longer gap (computer asleep) counts as 10 minutes away
  let cur = null, saveFn = null, last = 0, out = false, ticker = null, sinceSave = 0, unloading = false;
  const isOut = () => document.visibilityState === 'hidden' || (typeof document.hasFocus === 'function' && !document.hasFocus());
  function tick() {
    if (!cur) return;
    const now = Date.now(), dt = Math.max(0, now - last); last = now;
    const a = cur.act;
    if (dt > 5000) a.away += Math.min(dt, MAX_GAP);       // the timer was frozen: asleep or throttled in the background
    else if (out) a.away += dt; else a.ms += dt;
    sinceSave += dt;
    if (sinceSave >= 5000 && saveFn) { sinceSave = 0; saveFn(); }
  }
  function changed() {
    if (!cur || unloading) return;   // a reload or closing the page is counted as a reload, not as leaving
    tick();
    const now = isOut();
    if (now && !out) cur.act.lv++;
    out = now;
    if (saveFn) saveFn();
  }
  document.addEventListener('visibilitychange', changed);
  window.addEventListener('blur', changed);
  window.addEventListener('focus', changed);
  document.addEventListener('copy', () => { if (cur) { cur.act.cp++; if (saveFn) saveFn(); } });
  const leaving = () => { if (cur && !unloading) { tick(); if (saveFn) saveFn(); } unloading = true; };
  window.addEventListener('beforeunload', leaving);
  window.addEventListener('pagehide', leaving);
  window.addEventListener('pageshow', () => { unloading = false; });

  // begin (or resume) timing the question q; save() writes the game state
  function start(q, save) {
    pause();
    q.act = q.act || { ms: 0, away: 0, lv: 0, cp: 0, rl: 0, pid: PAGE };
    if (q.act.pid !== PAGE) { q.act.rl++; q.act.pid = PAGE; }
    cur = q; saveFn = save; last = Date.now(); out = isOut(); sinceSave = 0;
    ticker = setInterval(tick, 1000);
  }
  // stop counting (another screen is showing); the question keeps what it has so far
  function pause() { if (cur) tick(); if (ticker) clearInterval(ticker); ticker = null; cur = null; }
  // the question was answered: return its totals
  function finish(q) {
    if (cur === q) pause();
    const a = q.act || { ms: 0, away: 0, lv: 0, cp: 0, rl: 0 };
    return { ms: a.ms, away: a.away, lv: a.lv, cp: a.cp, rl: a.rl };
  }
  return { start, pause, finish };
})();
</script>
<script>
/* =====================================================================
   2. CONTENT PACK — Algebra II, Unit 3: Rational Exponents and Radical Functions.
   Lessons 1-6: nth roots and rational exponents; properties of rational exponents
   and radicals; composition and inverses of linear functions; inverses of nonlinear
   functions; graphing radical functions; radical equations.
   Worked like the unit test: everything is done without a calculator except hz-alt (Round 4 only), which says
   "Calculator allowed" in its prompt, like the test's Calculator part. The game has no calculator of its own.
   Version 3 (Nov 12): ev-calc and hz-dist removed; hz-alt moved to Round 4 only.
   Nov 15 (final handoff): the range restriction picks the sign of an inverse but is not written after it,
   so inverse answers are f^-1(x) = sqrt(x - 5), with no "; y >= 0".
   Version 2 (Nov 10) follows the updated handoff: transformations of y = x^2, the pendulum and sphere-volume
   models, and equations with two radicals are out; calculator evaluation, describing radical graphs, cube-root
   graphs, vertex-form inverses, the horizon-distance model and a decimal power model are in.

   Each entry in `questions` is { id, topic, gen() { return { q, a, d, why, check } } }.
   q = prompt, a = correct choice, d = wrong choices (each { t, m } with the mistake
   behind it), why = explanation shown after a miss, check = how test/check-pack.js
   verifies the math. Wrap math in $...$ . Rounds and key areas come from PLAN below.
   ===================================================================== */
const GAME_CONTENT = (function () {
  'use strict';
  const { rint, pick, shuffle, nz, gcd, fmtTerms, M, signed } = RG;

  // ---------- small formatting helpers ----------
  const D = (t, m) => ({ t, m });
  const ORD = { 2: 'square', 3: 'cube', 4: 'fourth', 5: 'fifth', 6: 'sixth' };
  // a fraction p/q in lowest terms, sign in front; whole numbers stay whole
  function fr(p, q) {
    if (q < 0) { p = -p; q = -q; }
    const g = gcd(p, q) || 1; p /= g; q /= g;
    if (q === 1) return String(p);
    return (p < 0 ? '-' : '') + '\\frac{' + Math.abs(p) + '}{' + q + '}';
  }
  // an nth root of some markup
  const rt = (n, inner) => (n === 2 ? '\\sqrt{' + inner + '}' : '\\sqrt[' + n + ']{' + inner + '}');
  // k times a root: 3√2, -√5, √7
  const kr = (k, n, inner) => (k === 1 ? '' : k === -1 ? '-' : String(k)) + rt(n, inner);
  // x - h written for inside a radical or parentheses: x-3, x+2, x
  const xh = (h, v) => (h === 0 ? (v || 'x') : (v || 'x') + (h > 0 ? '-' + h : '+' + (-h)));
  const par = (h, v) => (h === 0 ? (v || 'x') : '(' + xh(h, v) + ')');
  const plusk = k => (k === 0 ? '' : k > 0 ? '+' + k : String(k));
  const coefA = a => (a === 1 ? '' : a === -1 ? '-' : String(a));
  const pt = (x, y) => '(' + x + ', ' + y + ')';
  const ptM = (x, y) => M(pt(x, y));
  // decimals that come out exact: dec2(333, 100) -> "3.33"
  const dnum = v => String(Math.round(v * 1000) / 1000);
  const pm = b => '\\pm ' + b;
  const isqrt = n => { const r = Math.round(Math.sqrt(n)); return r * r === n ? r : null; };
  const icbrt = n => { const r = Math.round(Math.cbrt(n)); return r * r * r === n ? r : null; };
  // largest k with k^n dividing m: m = k^n * rest
  function pullOut(m, n) {
    let k = 1, rest = m;
    for (let f = 2; Math.pow(f, n) <= rest; f++) while (rest % Math.pow(f, n) === 0) { rest /= Math.pow(f, n); k *= f; }
    return [k, rest];
  }
  // square-free / cube-free numbers to sit under a radical
  const FREE2 = [2, 3, 5, 6, 7, 10, 11, 13, 14, 15];
  const FREE3 = [2, 3, 4, 5, 6, 7, 9, 10];

  // ---------- graphs ----------
  let figN = 0;
  // f on a fixed integer window; dots marks points (like the starting point of a square-root graph)
  function plot(f, win, o) {
    o = o || {};
    const small = !!o.small, W = small ? 190 : 300, H = small ? 160 : 240, pad = small ? 6 : 10;
    const [x0, x1, y0, y1] = win;
    const X = x => pad + (x - x0) / (x1 - x0) * (W - 2 * pad), Y = y => H - pad - (y - y0) / (y1 - y0) * (H - 2 * pad);
    const id = 'g3c' + (++figN) + '_' + rint(100, 999);
    let g = '<rect class="gf-bg" x="0" y="0" width="' + W + '" height="' + H + '" rx="8"/>';
    for (let x = Math.ceil(x0); x <= x1; x++) if (x !== 0) g += '<line class="gf-grid" x1="' + X(x) + '" y1="' + pad + '" x2="' + X(x) + '" y2="' + (H - pad) + '"/>';
    for (let y = Math.ceil(y0); y <= y1; y++) if (y !== 0) g += '<line class="gf-grid" x1="' + pad + '" y1="' + Y(y) + '" x2="' + (W - pad) + '" y2="' + Y(y) + '"/>';
    g += '<line class="gf-axis" x1="' + pad + '" y1="' + Y(0) + '" x2="' + (W - pad) + '" y2="' + Y(0) + '"/>';

        d: [D(DR(xd('ge'), yd(a > 0 ? 'le' : 'ge')), 'range-flip'), D(DR('$x \\ge ' + -h + '$', yd(ry)), 'inside-shift'), D(DR('all real numbers', 'all real numbers'), 'cube-domain'), D(DR(xd('ge'), yd(ry, -k || k + 1)), 'outside-shift')],
        why: [`The graph starts at $${pt(h, k)}$ and goes right, so the domain is $x \\ge ${h}$.`, a > 0 ? `$a > 0$, so the graph goes up from the starting point: $y \\ge ${k}$.` : `$a < 0$ reflects the graph, so it goes down from the starting point: $y \\le ${k}$.`],
        check: { kind: 'custom', test: () => '' }
      };
    } },

    { id: 'tf-fromgraph', topic: 'graph', gen() {
      const parent = pick(['cbrt', 'sqrt', 'sqrt']);
      if (parent === 'cbrt') {
        let a, h, k; do { a = pick([1, 2, 3, -1, -2, -3]); h = rint(-3, 3); k = rint(-3, 3); } while (Math.abs(a + k) > 6 || Math.abs(k - a) > 6);
        const x1 = h + 1, y1 = a + k, fn = cbrtF(a, h, k), win = [-6, 6, -7, 7];
        return {
          q: `The cube-root graph has center point $${pt(h, k)}$ and passes through $${pt(x1, y1)}$. Which equation is it?`, fig: plot(fn, win, { dots: [[h, k], [x1, y1]], label: 'graph of a cube-root function' }),
          a: M(radEq(3, a, h, k)), d: [D(M(radEq(3, a, h === 0 ? 1 : -h, k)), 'inside-shift'), D(M(radEq(3, -a, h, k)), 'reflect-miss'), D(M(radEq(3, a === 1 || a === -1 ? 2 * a : a + Math.sign(a), h, k)), 'a-value'), D(M(radEq(3, a, h, k === 0 ? 1 : -k)), 'outside-shift')],
          why: [`Start from $y = a\\sqrt[3]{x - h} + k$ with the center point: $y = a\\sqrt[3]{${xh(h)}}${plusk(k)}$.`, `Use the other point: $${y1} = a\\sqrt[3]{${x1 - h}}${plusk(k)} = a${plusk(k)}$, so $a = ${a}$.`],
          check: { kind: 'custom', test: () => (Math.abs(fn(x1) - y1) < 1e-9 ? '' : 'bad') }
        };
      }
      const a = pick([1, 2, 3, -1, -2]), h = rint(-4, 3), k = rint(-3, 3), x1 = h + 4, y1 = a * 2 + k;
      const fn = sqrtF(a, h, k), win = [-6, 8, -6, 7];
      return {
        q: `The square-root graph starts at $${pt(h, k)}$ and passes through $${pt(x1, y1)}$. Which equation is it?`, fig: plot(fn, win, { dots: [[h, k], [x1, y1]], label: 'graph of a square-root function' }),
        a: M(radEq(2, a, h, k)), d: [D(M(radEq(2, a, h === 0 ? 1 : -h, k)), 'inside-shift'), D(M(radEq(2, -a, h, k)), 'reflect-miss'), D(M(radEq(2, 2 * a, h, k)), 'a-value'), D(M(radEq(2, a, h, k === 0 ? 1 : -k)), 'outside-shift')],
        why: [`Start from $y = a\\sqrt{x - h} + k$ with the starting point: $y = a\\sqrt{${xh(h)}}${plusk(k)}$.`, `Use the other point: $${y1} = a\\sqrt{${x1 - h}}${plusk(k)} = 2a${plusk(k)}$, so $a = ${a}$.`],
        check: { kind: 'custom', test: () => (Math.abs(fn(x1) - y1) < 1e-9 ? '' : 'bad') }
      };
    } },

    { id: 'tf-graphpick', topic: 'graph', gen() {
      const n = pick([2, 2, 3]), a = pick([1, 2, -1, -2]), h = nz(-3, 3), k = nz(-3, 3);
      const F = n === 2 ? sqrtF : cbrtF, win = [-6, 6, -6, 6], eq = radEq(n, a, h, k);
      const g = (aa, hh, kk) => plot(F(aa, hh, kk), win, { small: true, dots: [[hh, kk]], label: 'graph' });
      return {
        q: `Which graph shows $${eq}$?`,
        a: g(a, h, k), d: [D(g(a, -h, k), 'inside-shift'), D(g(-a, h, k), 'reflect-miss'), D(g(a, h, -k), 'outside-shift')],
        why: [`The ${n === 2 ? 'starting' : 'center'} point is $${pt(h, k)}$.`, a > 0 ? 'Since $a > 0$, the graph rises to the right of that point.' : 'Since $a < 0$, the graph is reflected in the x-axis: it falls to the right of that point.'],
        check: { kind: 'custom', test: () => '' }
      };
    } },

    { id: 'hz-alt', topic: 'graph', gen() {
      const D0 = pick([50, 60, 75, 80, 90, 100, 110, 120, 125, 150]);
      const A = Math.pow(D0 / 1.22, 2), r0 = v => String(Math.round(v));
      const raw = [[D0 / 1.22, 'eq-square'], [D0 * D0 / 1.22, 'eq-isolate'], [Math.pow(1.22 * D0, 2), 'inv-steps']];
      const ds = raw.map(([v, m]) => [r0(v), m]).filter(([t]) => t !== r0(A));
      return {
        q: `Calculator allowed. A pilot can see about $d = 1.22\\sqrt{a}$ miles to the horizon, where $a$ is the altitude in feet. At about what altitude can a pilot see $${D0}$ miles? Round to the nearest foot.`,
        a: '$\\approx ' + r0(A) + '$ feet', d: ds.map(([t, m]) => D('$\\approx ' + t + '$ feet', m)),
        why: ['Divide by $1.22$ first, then square both sides.', `$\\sqrt{a} = \\frac{${D0}}{1.22}$, so $a = \\big{\\frac{${D0}}{1.22}}^{2} \\approx ${r0(A)}$ feet.`],
        check: { kind: 'custom', test: () => (Math.abs(1.22 * Math.sqrt(Math.round(A)) - D0) < 0.01 && new Set(ds.map(x => x[0])).size === ds.length && ds.length >= 3 ? '' : 'bad') }
      };
    } },

    /* ================= LESSON 6: RADICAL EQUATIONS ================= */
    { id: 'eq-basic', topic: 'eq', gen() {
      const a = nz(-9, 9), b = rint(2, 8), x = b * b - a;
      const lhs = '\\sqrt{' + xh(-a) + '}';
      return {
        q: `Solve $${lhs} = ${b}$.`,
        a: M('x = ' + x), d: [D(M('x = ' + (b - a)), 'eq-square'), D(M('x = ' + (b * b + a)), 'solve-arith'), D(M('x = ' + ((b - a) * (b - a))), 'eq-isolate'), D('No solution', 'extraneous-dropped')],
        why: ['Square both sides to undo the square root.', `$${xh(-a)} = ${b * b}$, so $x = ${x}$.`, `Check: $\\sqrt{${x}${plusk(a)}} = \\sqrt{${b * b}} = ${b}$ ✓`],
        check: { kind: 'roots', eq: `${lhs}=${b}`, roots: [x] }
      };
    } },

    { id: 'eq-cube', topic: 'eq', gen() {
      const c = pick([1, 2, 3]), b = nz(-4, 4), x = rint(-6, 9), d0 = b * b * b - c * x;
      const inner = fmtTerms([[c, 1], [d0, 0]]), lhs = '\\sqrt[3]{' + inner + '}';
      return {
        q: `Solve $${lhs} = ${b}$.`,
        a: M('x = ' + x), d: [D(M('x = ' + fr(b - d0, c)), 'eq-square'), D(M('x = ' + fr(b * b - d0, c)), 'eq-square'), D(M('x = ' + fr(b * b * b + d0, c)), 'solve-arith'), D('No solution', 'odd-neg')],
        why: ['Cube both sides to undo the cube root.', `$${inner} = ${b * b * b}$`, `$x = ${x}$`],
        check: { kind: 'roots', eq: `${lhs}=${b}`, roots: [x] }
      };
    } },

    { id: 'eq-isolate', topic: 'eq', gen() {
      const a = pick([2, 3, 4]), h = nz(-8, 8), k = nz(-9, 9), b = rint(1, 5), m = a * b + k, x = b * b - h;
      const lhs = a + '\\sqrt{' + xh(-h) + '}' + plusk(k);
      return {
        q: `Solve $${lhs} = ${m}$.`,
        a: M('x = ' + x), d: [D(M('x = ' + ((m - k) * (m - k) - h)), 'eq-isolate'), D(M('x = ' + (b - h)), 'eq-square'), D(M('x = ' + (b * b + h)), 'solve-arith'), D(M('x = ' + fr((m * m - k * k) / 1 - a * a * h, a * a)), 'eq-isolate')],
        why: ['Get the radical by itself before squaring.', `$${a}\\sqrt{${xh(-h)}} = ${m - k}$, so $\\sqrt{${xh(-h)}} = ${b}$.`, `Square: $${xh(-h)} = ${b * b}$, so $x = ${x}$. Check it in the original equation ✓`],
        check: { kind: 'roots', eq: `${lhs}=${m}`, roots: [x] }

    { id: 'eq-extraneous', topic: 'eq', gen() {
      // sqrt(p x + q) = x  with roots r1 > 0 (good) and r2 < 0 (extraneous)
      const r1 = rint(2, 6), r2 = -rint(1, r1 - 1), p = r1 + r2, q = -r1 * r2;
      const form = pick(['a', 'b']);
      const lhs = '\\sqrt{' + fmtTerms([[p, 1], [q, 0]]) + '}';
      const eq = form === 'a' ? lhs + ' = x' : 'x = ' + lhs;
      return {
        q: `Solve $${eq}$.`,
        a: M('x = ' + r1), d: [D(M('x = ' + r2 + ' \\text{ or } x = ' + r1), 'extraneous-kept'), D(M('x = ' + r2), 'extraneous-dropped'), D('No solution', 'extraneous-dropped')],
        why: ['Square both sides: $' + fmtTerms([[p, 1], [q, 0]]) + ' = x^{2}$, so $' + fmtTerms([[1, 2], [-p, 1], [-q, 0]]) + ' = 0$ and $(' + xh(r1) + ')(' + xh(r2) + ') = 0$.',
          `Check both in the original: $x = ${r1}$ works, but $x = ${r2}$ makes the square root equal a negative number, so it is extraneous.`],
        check: { kind: 'roots', eq: `${lhs}=x`, roots: [r1], reject: [r2] }
      };
    } },

    { id: 'eq-ratexp', topic: 'eq', gen() {
      const S = pick([[2, 3], [2, 3], [4, 3], [3, 2], [3, 2]]), [m, n] = S;
      const b = m === 4 ? 2 : m === 2 ? rint(2, 5) : rint(2, 4), c = m === 3 ? pick([1, 2, 3]) : 1;
      const k = c * Math.pow(b, m), x = Math.pow(b, n), even = m % 2 === 0;
      const lhs = (c === 1 ? '' : c) + 'x^{' + fr(m, n) + '}';
      return {
        q: `Solve $${lhs} = ${k}$.`,
        a: M('x = ' + (even ? pm(x) : x)),
        d: [D(M('x = ' + (even ? x : pm(x))), even ? 'no-pm' : 'extra-pm'), D(M('x = ' + (even ? pm(b) : b)), 'ratexp-power'), D(M('x = ' + (k / c) + '^{' + fr(m, n) + '}'), 'ratexp-power'), D(M('x = ' + (even ? pm(Math.pow(b, m)) : k / c)), 'ratexp-power')],
        why: [c > 1 ? `Divide by $${c}$ first: $x^{${fr(m, n)}} = ${k / c}$.` : `Raise both sides to the reciprocal power, $${fr(n, m)}$.`,
          `$x = ${k / c}^{${fr(n, m)}} = (${rt(m, k / c)})^{${n}} = ${b}^{${n}} = ${x}$` + (even ? '; the numerator of the exponent is even, so $x = \\pm ' + x + '$ (both signs check).' : '')],
        check: { kind: 'roots', eq: `${lhs}=${k}`, roots: even ? [x, -x] : [x] }
      };
    } }

  ];

  /* ================= SKILLS AND MISTAKES (for the results code and the teacher's report) ================= */
  const SKILLS = {
    'nth-roots': 'nth roots: real roots and how many there are',
    'rat-exp': 'Rational exponents: converting and evaluating',
    'solve-power': 'Solving xⁿ = k and (x − h)ⁿ = k',
    'exp-props': 'Properties of rational exponents and radicals',
    'simplify-rad': 'Simplest form, rationalizing, like radicals',
    'composition': 'Composition of functions',
    'inv-linear': 'Inverses of linear functions and models',
    'inv-nonlinear': 'Inverses of nonlinear functions (one-to-one, restricted domains)',
    'transform': 'Describing and writing radical graphs (shifts, stretches, reflections)',
    'radical-graphs': 'Radical functions: key points, domain and range, graphs, models',
    'radical-eqs': 'Radical and rational-exponent equations'
  };
  const SKILL_LIST = {
    'nth-roots': ['rt-real', 'rt-count'],
    'rat-exp': ['ex-to-exp', 'ex-to-rad', 'ev-unit', 'ev-frac', 'ev-neg'],
    'solve-power': ['sv-pow', 'sv-coef', 'sv-shift'],
    'exp-props': ['pr-prod', 'pr-power', 'pr-quot', 'pr-radprod', 'pr-radprod3', 'pr-radquot', 'sm-varexp'],
    'simplify-rad': ['sm-simplest', 'sm-simplest3', 'sm-ration', 'sm-ration3', 'sm-like', 'sm-like3', 'sm-var', 'sm-pm'],
    'composition': ['cp-eval', 'cp-write', 'cp-domain', 'cp-discount'],
    'inv-linear': ['il-linear', 'il-verify', 'il-model', 'il-model-use'],
    'inv-nonlinear': ['in-onetoone', 'in-pairs', 'in-cubic', 'in-quad', 'in-quad-hard', 'in-quad-vertex', 'in-model'],
    'transform': ['rd-describe', 'tf-write'],
    'radical-graphs': ['tf-start', 'tf-keypoint', 'tf-domain', 'tf-fromgraph', 'tf-graphpick', 'hz-alt'],
    'radical-eqs': ['eq-basic', 'eq-cube', 'eq-isolate', 'eq-extraneous', 'eq-ratexp']
  };

  // The mistake behind each wrong choice, in words for the teacher's report.
  const MISTAKES = {
    'no-pm': 'Dropped the ± after taking an even root to undo an even power',
    'extra-pm': 'Added ± where only one answer works (odd root or odd power)',
    'pm-principal': 'Gave ± for a radical that was already in the problem (principal root only)',
    'root-sign': 'Wrong sign on a real nth root',
    'odd-neg': 'Said an odd root of a negative number is not real',
    'even-neg': 'Gave a real value for an even root of a negative number',
    'root-count': 'Wrong number of real nth roots or solutions',
    'rad-form': 'Mixed up the index and the power converting between radical and exponent form',
    'exp-meaning': 'Multiplied or divided by a rational exponent instead of taking a root',
    'exp-order': 'Took the root but not the power (or the reverse) in a rational exponent',
    'neg-exp': 'Read a negative exponent as a negative number instead of a reciprocal',
    'expand-power': 'Expanded (x - h)^n instead of taking the root first',
    'shift-sign': 'Sign of h wrong after taking the root of (x - h)^n',
    'solve-order': 'Took the root before getting the power by itself',
    'exp-rules': 'Used the wrong exponent rule (multiplied or divided exponents instead of adding or subtracting)',
    'add-bases': 'Combined the bases instead of adding exponents',
    'add-radicands': 'Added or subtracted the numbers under radicals',
    'root-forgot': 'Forgot to take the root',
    'root-arith': 'Arithmetic slip with a root',
    'not-simplest': 'Stopped before taking out every perfect power',
    'decimal-form': 'Gave a decimal instead of simplest radical form',
    'rationalize-partial': 'Rationalized the denominator only partly (or not the numerator)',
    'rationalize-cube': 'Multiplied by the wrong cube root when rationalizing',
    'unlike-radicals': 'Did not simplify first, so missed that the radicals were like radicals',
    'var-root': 'Took the root of a variable power incorrectly',
    'sign-error': 'Sign error',
    'comp-order': 'Composed in the wrong order (outside-in)',
    'comp-op': 'Multiplied or added the functions instead of composing',
    'comp-distribute': 'Did not distribute or square the whole inner function',
    'comp-arith': 'Arithmetic slip in a composition',
    'comp-domain': 'Domain of a composition read only from the simplified answer',
    'inv-reciprocal': 'Treated the inverse as 1/f(x)',
    'inv-steps': 'Undid the steps in the wrong order or with the wrong operation when solving for the inverse',
    'inv-verify': 'Wrong conclusion verifying inverses (both orders must give x)',
    'model-switch': 'Switched the variables in a real-world model instead of solving for the other one',
    'model-eval': 'Evaluated the original model instead of using the inverse',
    'one-to-one': 'Misjudged whether a function is one-to-one (horizontal line test)',
    'pairs': 'Did not switch the coordinates to write the inverse',
    'inv-pm': 'Left ± in the inverse instead of using the range restriction',
    'inv-range-sign': 'Picked the wrong sign from the domain/range restriction',
    'root-before-isolate': 'Took the root before getting the squared (or cubed) term by itself',
    'cube-shift': 'Put the shift inside the cube root instead of outside (or the reverse)',
    'inside-shift': 'Inside shift the wrong way (x - h moves right h)',
    'outside-shift': 'Outside shift wrong (up/down or moved to the wrong place)',
    'reflect-miss': 'Missed or misplaced a reflection in the x-axis',
    'stretch-factor': 'Missed the vertical stretch or shrink',
    'stretch-shift-order': 'Shifted before stretching in the key-point method',
    'vertex-sign': 'Mixed up h and k in the starting point or vertex',
    'range-flip': 'Range not flipped when a < 0',
    'cube-domain': 'Restricted a cube root (or did not restrict a square root) in the domain or range',
    'a-value': 'Found the wrong value of a from the graph',
    'eq-square': 'Did not square (or cube) both sides to undo the radical',
    'eq-isolate': 'Squared before getting the radical by itself',
    'solve-arith': 'Arithmetic or sign slip solving the equation',
    'extraneous-kept': 'Kept an extraneous solution (did not check)',
    'extraneous-dropped': 'Rejected a solution that works',
    'ratexp-power': 'Raised both sides to the wrong power solving a rational-exponent equation',
    'calc-parens': 'Typed a fractional exponent on the calculator without parentheses',
    'model-order': 'Multiplied before taking the square root in a model'
  };

  /* ================= THE REVIEW PLAN =================
     Which round each problem type is in, and which key area it belongs to. The game deals the key areas
     to each student like a shuffled deck (every area once, in random order, before any area repeats). */
  const AREAS = {
    roots: 'nth roots and rational exponents',
    solvepow: 'Solving power equations',
    props: 'Exponent and radical properties',
    simplify: 'Simplest radical form',
    compose: 'Composition',
    invlin: 'Inverses of linear functions',
    invnon: 'Inverses of nonlinear functions',
    transform: 'Describing radical graphs',
    radfn: 'Radical functions',
    radeq: 'Radical equations'
  };
  const PLAN = {
    1: {
      roots: ['rt-real', 'rt-count', 'ex-to-exp', 'ev-unit'], solvepow: ['sv-pow'], props: ['pr-prod', 'pr-radprod'], simplify: ['sm-simplest', 'sm-pm'],
      compose: ['cp-eval'], invlin: ['il-linear'], invnon: ['in-onetoone'], transform: ['rd-describe'], radfn: ['tf-start'], radeq: ['eq-basic']
    },

      roots: ['ex-to-rad', 'ev-frac'], solvepow: ['sv-pow', 'sv-coef'], props: ['pr-power', 'pr-quot', 'pr-radprod3', 'sm-varexp'], simplify: ['sm-simplest3', 'sm-ration', 'sm-like'],
      compose: ['cp-write'], invlin: ['il-linear', 'il-verify'], invnon: ['in-pairs', 'in-cubic'], transform: ['rd-describe', 'tf-write'], radfn: ['tf-domain', 'tf-start'], radeq: ['eq-basic', 'eq-cube']
    },

  const all = questions;
  all.forEach(q => { q.round = []; q.areas = {}; });
  Object.keys(PLAN).forEach(r => Object.keys(PLAN[r]).forEach(area => PLAN[r][area].forEach(id => {
    const q = all.find(t => t.id === id);
    if (!q) throw new Error('PLAN names a missing template: ' + id);
    if (!q.round.includes(Number(r))) q.round.push(Number(r));
    q.areas[r] = area; q.area = q.area || area;
  })));
  Object.keys(SKILL_LIST).forEach(k => SKILL_LIST[k].forEach(id => { const q = all.find(t => t.id === id); if (q) q.skill = k; }));

  return {
    id: 'alg2-radicals-unit',
    version: 3,
    title: 'Algebra II Review Game',
    subtitle: 'Rational Exponents and Radical Functions Review',
    // 3 x 3 steps per round, four rounds. No calculator except problems marked "Calculator allowed" (Round 4). Leaving the game brings a new problem; copying is off.
    settings: { puzzle: { cols: 3, rows: 3, perCorrect: 1, perMiss: 1 }, missPauseSeconds: 4, endlessRounds: [3, 4], rotateBy: 'area',
      swapOnLeave: { awaySeconds: 4 }, blockCopy: true,
      rules: ['Work every problem <b>without a calculator</b>, just like the No Calculator part of the test. A few Round 4 problems say <b>Calculator allowed</b>; only those may use one.'] },
    topics: [
      { key: 'roots', name: 'nth Roots and Rational Exponents' },
      { key: 'props', name: 'Properties of Exponents and Radicals' },
      { key: 'comp', name: 'Composition and Inverses' },
      { key: 'inv', name: 'Inverses of Nonlinear Functions' },
      { key: 'graph', name: 'Graphing Radical Functions' },
      { key: 'eq', name: 'Radical Equations' }
    ],
    rounds: [
      { name: 'Warm-Up', blurb: 'One-step skills' },
      { name: 'Building', blurb: 'Two-step problems' },
      { name: 'Stepping Up', blurb: 'Multi-step, test-style problems' },
      { name: 'Test Level', blurb: 'The hardest mix' }
    ],
    areas: AREAS,

    mistakes: MISTAKES,

  };
})();

<script>
/* =====================================================================
   3a. PAINT KIT — shared drawing pieces for the storybook look of the
   puzzle pictures (art.js) and the round scenes (scenes.js): no outlines,
   soft gradients, late-afternoon light, a light paper grain.
   Paint.raster() turns a finished, unchanging picture into one image so the
   browser does not redraw hundreds of shapes on every animation frame.
   ===================================================================== */
const Paint = (function () {
  'use strict';
  const f = n => Math.round(n * 10) / 10;
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const stops = s => s.map(p => '<stop offset="' + p[0] + '" stop-color="' + p[1] + '"' + (p[2] !== undefined ? ' stop-opacity="' + p[2] + '"' : '') + '/>').join('');
  const lg = (id, s, x1, y1, x2, y2) => '<linearGradient id="' + id + '" x1="' + (x1 || 0) + '" y1="' + (y1 || 0) + '" x2="' + (x2 === undefined ? 0 : x2) + '" y2="' + (y2 === undefined ? 1 : y2) + '">' + stops(s) + '</linearGradient>';
  const rg = (id, s, cx, cy, r, fx, fy) => '<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stops(s) + '</radialGradient>';

  // mix two #rrggbb colors; t = 0 gives a, 1 gives b
  function mix(a, b, t) {
    const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const A = p(a), B = p(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }

  // ===== 6. Corn shocks in a harvested field at sunset =====
  const shocks = (function () {
    const p = 'tg6', r = K.rng(406), land = K.landscape(p, r, { sunX: 220, sunY: 120, lawnY: 172, blades: 300, litter: 4, lawnTop: '#b39a52', lawnBottom: '#8a7438' });
    let s = '';
    // stubble rows in the harvested field
    for (let row = 0; row < 7; row++) {
      const y = 178 + row * 9;
      for (let x = -4; x < 304; x += 6 + row) s += '<path d="M' + f(x + r() * 3) + ' ' + y + 'l' + f(r() - 0.5) + '-' + f(2 + row * 0.7) + '" stroke="' + (row % 2 ? '#cdb06a' : '#a88a48') + '" stroke-width="1.1"/>';
    }
    // a shock: dry stalks bundled and tied, flaring at the bottom
    function shock(x, y, h, w) {
      let g = K.shadow(p + '-shade', x + w * 0.3, y, w * 0.9, h * 0.05);
      for (let k = 0; k < 22; k++) {
        const t = k / 21, bx = x - w / 2 + t * w, c = mix('#a8884a', '#e2c47a', (Math.sin(k * 2.3) + 1) / 2 * (0.4 + t * 0.6));
        g += '<path d="M' + f(bx) + ' ' + y + 'Q' + f(x + (bx - x) * 0.25) + ' ' + f(y - h * 0.55) + ' ' + f(x + (t - 0.5) * 6) + ' ' + f(y - h) + '" stroke="' + c + '" stroke-width="' + f(2.6 + r() * 1.6) + '" fill="none"/>';
      }
      for (let k = 0; k < 6; k++) { const a = -Math.PI / 2 + (k - 2.5) * 0.4; g += '<path d="M' + x + ' ' + f(y - h) + 'q' + f(Math.cos(a) * 10) + ' ' + f(Math.sin(a) * 10) + ' ' + f(Math.cos(a) * 16) + ' ' + f(Math.sin(a) * 6) + '" stroke="#c9ab64" stroke-width="2" fill="none"/>'; }
      g += '<path d="M' + f(x - w * 0.18) + ' ' + f(y - h * 0.62) + 'Q' + x + ' ' + f(y - h * 0.58) + ' ' + f(x + w * 0.18) + ' ' + f(y - h * 0.62) + '" stroke="#6a4a24" stroke-width="2.4" fill="none"/>';
      return g;
    }
    s += shock(60, 170, 40, 26) + shock(250, 168, 36, 22) + shock(116, 196, 70, 46) + shock(214, 214, 92, 60);

    return {
      name: 'shocks', label: 'corn shocks', width: 300, height: 240,
      // a sunset sky: the shared landscape's colors, warmed
      defs: land.defs.replace(/#7fa6c4/g, '#8a8fb0').replace(/#c9d8da/g, '#e2c2a2').replace(/#efd9b3/g, '#f2c48a').replace(/#f4cf98/g, '#f4a868') + pumpkinDefs(p),

  // What each round finishes, in order: animated scenes (scenes.js) for rounds 1-3, the church jigsaw for round 4,

  const rewards = [
    { scene: 'table', clip: 0 },         // the harvest table is set; a match lights the candles ("Now Thank We All Our God", organ)

      '<g clip-path="url(#' + uid + '-board)"><rect class="pz-sheen" x="0" y="' + (board.y - 40) + '" width="110" height="' + (H + 80) + '" fill="url(#' + uid + '-sheen)" opacity="0"/>' +

/* =====================================================================

  const TEXT = {
    table: {
      label: 'harvest table', blurb: 'a harvest table to set', progress: 'dishes on the table', doneShort: 'The table is set!',
      gain: k => (k === 1 ? 'Another dish goes on the table.' : 'More dishes go on the table.'),
      lose: () => 'A dish goes back to the kitchen.', none: 'No dishes were on the table yet.'
    },
    wagon: {
      label: 'harvest wagon', blurb: 'a wagon to load', progress: 'pumpkins loaded', doneShort: 'The wagon is full!',
      gain: k => (k === 1 ? 'A pumpkin goes into the wagon.' : 'Pumpkins go into the wagon.'),

    },

      gain: k => (k === 1 ? 'A goose joins the V.' : 'Geese join the V.'),
      lose: () => 'A goose drops out of the V.', none: 'No geese were in the V yet.'

  function create(host, o) {
    const uid = 'sc' + (++made), reduced = !!o.reduced, n = Math.min(12, o.steps || 9), r = K.rng(o.seed || 7);
    const scene = BUILD[o.scene](uid, n, r);
    host.innerHTML = '<svg class="pz sc" viewBox="0 0 320 262" role="img" aria-label="' + scene.aria + '">' +
      '<defs>' + scene.defs + '<clipPath id="' + uid + '-frame"><rect x="0" y="0" width="' + W + '" height="' + H + '" rx="8"/></clipPath></defs>' +
      '<rect class="pz-board" x="5" y="5" width="' + (W + 10) + '" height="' + (H + 10) + '" rx="10"/>' +
      '<g transform="translate(10 10)" clip-path="url(#' + uid + '-frame)"><g class="sc-bg">' + scene.bg + '</g>' + scene.svg +
      K.grainRect(uid + '-grain', W, H, 0.12) + '</g></svg>';
    const svg = host.querySelector('svg'), q = sel => Array.from(svg.querySelectorAll(sel));
    const pose = (el, p) => { el.setAttribute('transform', 'translate(' + f(p.x) + ' ' + f(p.y) + ') rotate(' + f(p.rot || 0) + ') scale(' + f(p.s === undefined ? 1 : p.s) + (p.sy !== undefined ? ' ' + f(p.sy) : '') + ')'); if (p.o !== undefined) el.setAttribute('opacity', f(p.o)); };
    let dead = false;
    // the background never changes: draw it once as an image (falls back to the vector drawing)
    K.raster('<defs>' + scene.defs + '</defs>' + scene.bg, W, H, 2).then(url => {
      const bg = svg.querySelector('.sc-bg');
      if (url && !dead && bg) bg.innerHTML = '<image href="' + url + '" width="' + W + '" height="' + H + '"/>';
    });

    // ---- tiny animation engine: a tween calls fn(t) with t going 0 to 1 ----
    const tweens = new Set();
    let raf = null;
    function frame(now) {
      raf = null;
      tweens.forEach(tw => {
        if (now < tw.start) return;
        const t = Math.min(1, (now - tw.start) / tw.dur);
        tw.fn(t);
        if (t >= 1) { tweens.delete(tw); tw.done(); }
      });
      if (tweens.size && !dead) raf = requestAnimationFrame(frame);
    }
    function tween(dur, fn, delay) {
      if (reduced || dead) { fn(1); return Promise.resolve(); }
      return new Promise(done => {
        tweens.add({ start: performance.now() + (delay || 0), dur, fn, done });
        if (!raf) raf = requestAnimationFrame(frame);
      });
    }
    const wait = ms => (reduced || dead ? Promise.resolve() : new Promise(res => setTimeout(res, ms)));
    function stopAll() { const all = Array.from(tweens); tweens.clear(); all.forEach(tw => { tw.fn(1); tw.done(); }); }
    // wind: a few faint, fast streaks across the picture
    function gust(leftward) {
      const g = svg.querySelector('.sc-gust');
      if (!g) return Promise.resolve();
      return tween(1100, t => pose(g, { x: leftward ? lerp(320, -200, t) : lerp(-200, 320, t), y: 60 + 14 * Math.sin(t * 4), o: Math.sin(Math.PI * t) * 0.55 }));
    }

    const api = scene.init({ svg, q, pose, tween, wait, gust, r, n, reduced, easeInOut, easeOut, easeIn, stopAll: () => stopAll() });
    const done = new Array(n).fill(false);
    // These scenes fill up in order (the first dish is the turkey, the V builds from the leader back, the wagon
    // fills from the bottom row), so the engine's step numbers only count how many are done.
    const firstK = () => { const k = done.filter(Boolean).length; return done.map((_, j) => j < k); };
    function sync(list) { stopAll(); const on = new Set(list); for (let i = 0; i < n; i++) done[i] = on.has(i); api.sync(firstK()); }
    function place(i, delay) { done[i] = true; const k = done.filter(Boolean).length; return wait(delay || 0).then(() => api.place(k - 1, k)); }
    function remove(i, delay) { done[i] = false; const k = done.filter(Boolean).length; return wait(delay || 0).then(() => api.remove(k, k)); }
    function explode() { stopAll(); for (let i = 0; i < n; i++) done[i] = true; api.sync(done.slice()); return api.finale().then(() => { for (let i = 0; i < n; i++) done[i] = false; }); }
    // ambient motion while the scene sits on screen (clouds, grass, steam, ripples...), about 30 frames a second;
    // it pauses while the page is hidden and is off entirely for reduced motion
    let amb = null, ambLast = 0;
    function ambLoop(now) {
      amb = null; if (dead) return;
      if (!document.hidden && now - ambLast > 32) { ambLast = now; try { api.ambient(now / 1000); } catch (e) { /* keep going */ } }
      amb = requestAnimationFrame(ambLoop);
    }
    if (!reduced && api.ambient) amb = requestAnimationFrame(ambLoop);
    function destroy() { dead = true; if (raf) cancelAnimationFrame(raf); if (amb) cancelAnimationFrame(amb); stopAll(); }
    sync(o.placed || []);
    return { count: n, place, remove, explode, sync, destroy, finaleMs: 7200, placedList: () => done.map((d, i) => (d ? i : -1)).filter(i => i >= 0) };
  }

  const LEAF = (c, k) => '<g class="' + k + '" opacity="0"><path d="M0-4.4C3.4-3.4 4.4 0 0 4.4C-4.4 0-3.4-3.4 0-4.4Z" fill="' + c + '"/><path d="M0-4V4" stroke="#5a2a10" stroke-width=".5" opacity=".5"/></g>';
  const GLINT = '<path d="M0-7L1.3-1.3L7 0L1.3 1.3L0 7L-1.3 1.3L-7 0L-1.3-1.3Z" fill="#fff8e0"/>';
  const easeOutBack = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  // drifting clouds: each crosses slowly and wraps around
  function drift(clouds, T) { clouds.forEach(c => { const k = +c.dataset.k, sp = 3 + k * 1.3; c.setAttribute('transform', 'translate(' + f(((T * sp + k * 150) % 380) - 40) + ' ' + c.dataset.y + ')'); }); }
  function sway(tufts, T, amt) { tufts.forEach((g, k) => g.setAttribute('transform', 'translate(' + g.dataset.x + ' ' + g.dataset.y + ') rotate(' + f(Math.sin(T * 1.5 + k * 0.9) * (amt || 4) + Math.sin(T * 3.7 + k) * 1.2) + ')')); }
  function twinkle(stars, T, on) { stars.forEach((st, k) => st.setAttribute('opacity', f(on * (0.55 + 0.45 * Math.sin(T * 2.4 + k * 1.7))))); }

  // a leaf drifting down: sideways sway, a slow tumble, and a flip that narrows it now and then
  function fallPose(a, b, t, m) {
    const sw = Math.sin(TAU * m.freq * t + m.ph);
    return {
      x: lerp(a.x, b.x, easeInOut(t)) + sw * m.amp * Math.sqrt(1 - t),
      y: lerp(a.y, b.y, Math.pow(t, 1.25)),

      s: a.s * (0.3 + 0.7 * Math.abs(Math.cos(Math.PI * m.flips * t))) * (1 - t) + b.s * t,
      sy: lerp(a.s, b.sy, t)
    };
  }
